\* SPEC: BlockBody.tla
\* Mutation: an invalid tx also spends its input. Expected: UtxoMatches fails.
SPECIFICATION Spec
CONSTANTS
    Era = "Alonzo"
    PV = 7
    Mainnet = TRUE
    MaxTxs = 2
    MaxInvalidLen = 2
    MaxBody = 3
    MaxEx = 1
    MaxRef = 0
    InChoices = {"g", "prev", "prevret"}
    CollChoices = {"k", "prevret"}
    RefChoices = {"none", "g", "prev"}
    ScriptChoices = {0}
    ExChoices = {0, 1}
    SizeOffs = {"exact"}
    HashOks = {TRUE}
    WitOffs = {"same"}
    HdrPVs = {7}
    GoFixed = FALSE
    Mutation = "InvalidSpendsInputs"
INVARIANTS
    UtxoMatches
