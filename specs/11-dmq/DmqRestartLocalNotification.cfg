\* SPEC: DmqRestart.tla
\* The reference [R11][R12] (and gOuroboros with the restart fix): two runs of LocalNotification on one connection. The server restarts after MsgDone, so every message of the second run is read. Passes.
SPECIFICATION Spec

CONSTANTS
    Proto = "LocalNotification"
    MaxRuns = 2
    MaxMsgs = 6
    ServerRestarts = TRUE

INVARIANT TypeOK
INVARIANT NoViolation
INVARIANT NewRunServed
