\* SPEC: LeiosNotify.tla
\* THE BUG (gOuroboros client at PR 3160 head cfa1edeb). Intentionally
\* fails: SyncAfterStopReportsShutdown is violated. Sync checked
\* "notification loop is already running" before quitting, and after Stop
\* the loop waits in Wait until the protocol ends, so Sync after Stop
\* reported a running loop instead of the shutdown.
SPECIFICATION Spec

CONSTANTS
    PipelineLimit = 2
    MaxRequests = 5
    StopLocksBurst = TRUE
    SyncChecksQuitFirst = FALSE
    CancelIsErrorBeforeQuit = TRUE
    RogueCancel = FALSE
    ServerCancelsOnQuit = TRUE
    SourceDry = FALSE

INVARIANT SyncAfterStopReportsShutdown
