\* SPEC: LeiosNotify.tla
\* The fix, with a server that has nothing to notify: only MsgCanceled answers.
SPECIFICATION Spec

CONSTANTS
    PipelineLimit = 2
    MaxRequests = 5
    StopLocksBurst = TRUE
    SyncChecksQuitFirst = TRUE
    CancelIsErrorBeforeQuit = TRUE
    RogueCancel = FALSE
    ServerCancelsOnQuit = TRUE
    SourceDry = TRUE

INVARIANT NoRequestAfterQuit
INVARIANT ClientNoViolation
INVARIANT LoopCanProgress
INVARIANT EveryRequestAnswered
INVARIANT SyncAfterStopReportsShutdown
