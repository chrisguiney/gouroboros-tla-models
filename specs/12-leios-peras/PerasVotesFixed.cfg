\* SPEC: PerasVotes.tla
\* gOuroboros with the fix (f7ebba9b) against a reference peer: its client against the reference server, which sends MsgAwaitReply and then identifiers or MsgServerIdle. Its own server does the same, so this is also the fixed client against the fixed server.
SPECIFICATION Spec

CONSTANTS
    Window = 2
    MaxRounds = 3
    ReferenceServer = TRUE
    ServerMayBeEmpty = TRUE
    ClientKnowsAwait = TRUE

INVARIANT NoClientViolation
INVARIANT NoServerFailure
INVARIANT WindowBound
