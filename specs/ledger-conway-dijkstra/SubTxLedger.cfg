\* SPEC: SubTx.tla
\* The reference's batches applied one after another preserve value, spend
\* each input once and, when invalid, give up only collateral. Expected: all hold.
SPECIFICATION Spec
CONSTANTS
    MaxRef = 5
    MaxTxs = 2
    Mutation = "none"
INVARIANTS
    ValuePreserved
    SpentOnce
    InvalidKeeps
