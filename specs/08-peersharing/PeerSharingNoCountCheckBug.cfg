\* SPEC: PeerSharing.tla
\* Intentionally fails. The client does not compare the reply's length with
\* its request, so a rogue server's long reply is accepted.
SPECIFICATION Spec

CONSTANTS
    Amounts = {0, 1, 2}
    ByteCap = 1
    Available = 2
    MaxRequests = 3
    MaxRuns = 2
    RogueMessages = 1
    UseTimeouts = TRUE
    SlowPeers = FALSE
    ClampToAmount = TRUE
    ClampToCap = TRUE
    ClientChecksCount = FALSE
    ServerRestarts = TRUE

INVARIANT NeverTakesTooMany
