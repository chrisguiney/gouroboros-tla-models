\* SPEC: PeerSharing.tla
\* Intentionally fails. The server does not restart after MsgDone (as the
\* gOuroboros keep-alive server once did). A client's second run is never
\* answered and times out. gOuroboros's peer-sharing server does restart.
SPECIFICATION Spec

CONSTANTS
    Amounts = {0, 1, 2}
    ByteCap = 1
    Available = 2
    MaxRequests = 3
    MaxRuns = 2
    RogueMessages = 0
    UseTimeouts = TRUE
    SlowPeers = FALSE
    ClampToAmount = TRUE
    ClampToCap = TRUE
    ClientChecksCount = TRUE
    ServerRestarts = FALSE

INVARIANT NoFailures
