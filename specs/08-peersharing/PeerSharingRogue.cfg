\* SPEC: PeerSharing.tla
\* Up to two rogue messages of any kind, into either inbox, at any time.
\* Only legal moves, failures final, no deadlock, and the client never
\* accepts more peers than it asked for.
SPECIFICATION Spec

CONSTANTS
    Amounts = {0, 1, 2}
    ByteCap = 1
    Available = 2
    MaxRequests = 3
    MaxRuns = 2
    RogueMessages = 2
    UseTimeouts = TRUE
    SlowPeers = FALSE
    ClampToAmount = TRUE
    ClampToCap = TRUE
    ClientChecksCount = TRUE
    ServerRestarts = TRUE

INVARIANT TypeOK
INVARIANT NeverTakesTooMany

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
