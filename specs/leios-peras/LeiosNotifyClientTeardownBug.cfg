\* SPEC: LeiosNotifyClientTeardown.tla
\* gOuroboros v0.222.0: NotificationFunc fails while a later pipelined
\* notification is in recvLoop; the handler blocks on notificationChan for
\* ever, recvLoop never returns, Stop never returns (deadlock).
SPECIFICATION Spec
CONSTANTS
    PipelineLimit = 2
    MaxRequests = 3
    Outcomes = {"ok", "err"}
    Fixed = FALSE
    CloseOnStop = FALSE
INVARIANT TypeOK NoSendOnClosed
