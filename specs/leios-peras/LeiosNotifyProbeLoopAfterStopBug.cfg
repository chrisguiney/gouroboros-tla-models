\* SPEC: LeiosNotify.tla
\* REACHABILITY PROBE on LeiosNotify.cfg. Intentionally fails: the loop
\* is still running after Stop, so SyncAfterStopReportsShutdown is not vacuous.
SPECIFICATION Spec

CONSTANTS
    PipelineLimit = 2
    MaxRequests = 5
    StopLocksBurst = TRUE
    SyncChecksQuitFirst = TRUE
    CancelIsErrorBeforeQuit = TRUE
    RogueCancel = FALSE
    ServerCancelsOnQuit = TRUE
    SourceDry = FALSE

INVARIANT ProbeLoopNeverRunsAfterStop
