\* SPEC: PerasClientOpMu.tla
\* PerasClientOpMuKeptCtxBug with ScopedMarker: the marker refuses a call
\* only while the VoteFunc call that made it runs, so the later call waits
\* for the lock and returns; a call back from VoteFunc still fails at once.
SPECIFICATION Spec
CONSTANTS
    Fixed = TRUE
    ReentryCtx = "own"
    DoneCaller = FALSE
    ServerAnswers = TRUE
    Await = FALSE
    AwaitOutcomes = {}
    KeptCall = TRUE
    ScopedMarker = TRUE
INVARIANT KeptCallNotRefused LockSound VoteFuncCallReturns CancelledDoneReturns EveryCallReturns
