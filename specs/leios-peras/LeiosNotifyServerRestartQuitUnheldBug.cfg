\* SPEC: LeiosNotifyServerRestart.tla
\* MUTATION of LeiosNotifyServerRestart.cfg: MsgQuit handled before the request is answered. Intentionally fails by ReplyOnOwnInstance: the restart installs the second instance first and the request goroutine answers on it.
SPECIFICATION Spec
CONSTANTS
    JoinRetired = TRUE
    HoldQuit = FALSE
INVARIANT TypeOK
INVARIANT NoCallbackAfterStop
INVARIANT ReplyOnOwnInstance
INVARIANT ResponseSentOnce
