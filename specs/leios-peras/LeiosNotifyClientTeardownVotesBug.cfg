\* SPEC: LeiosNotifyClientTeardown.tla
\* The same shape in the LeiosVotes client (protocol/leiosvotes/client.go
\* v0.222.0: voteLoop = nl, handleVote = the handler, voteChan unbuffered,
\* VoteFunc error -> SendError -> return). One request for two votes is
\* modelled as two owed answers (PipelineLimit 2). Deadlock as in
\* LeiosNotifyClientTeardownBug; fixed by the same StopChan case.
SPECIFICATION Spec
CONSTANTS
    PipelineLimit = 2
    MaxRequests = 3
    Outcomes = {"ok", "err"}
    Fixed = FALSE
    CloseOnStop = FALSE
INVARIANT TypeOK NoSendOnClosed
