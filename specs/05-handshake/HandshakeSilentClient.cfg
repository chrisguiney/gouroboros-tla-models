\* The client never proposes. Node-to-node: the server times out in
\* StPropose instead of waiting forever (no deadlock).
\* SPEC: Handshake.tla
SPECIFICATION Spec

CONSTANTS
    Versions = {1, 2}
    Magics = {0, 1}
    Mode = "NtN"
    SilentPeer = "Client"
    RogueMessages = 0
    QueryFirst = FALSE
    StrictQueryReply = FALSE
    HandleReplyVersions = TRUE
    Mutation = "None"

INVARIANT TypeOK
INVARIANT NoViolations
INVARIANT TimeoutsOnlyNtN

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
