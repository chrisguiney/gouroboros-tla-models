\* Honest client and server, reference behaviour, node-to-node. Every
\* proposal from two versions and two magics, with and without a query.
SPECIFICATION Spec

CONSTANTS
    Versions = {1, 2}
    Magics = {0, 1}
    Mode = "NtN"
    SilentPeer = "None"
    RogueMessages = 0
    QueryFirst = FALSE
    StrictQueryReply = FALSE
    HandleReplyVersions = TRUE
    AcceptOwnData = FALSE
    CheckKeyOrder = TRUE
    UnorderedKeys = FALSE
    Mutation = "None"

INVARIANT TypeOK
INVARIANT NoFailures
INVARIANT AcceptsHighestCommon
INVARIANT AcceptsOnlyMatchingMagic
INVARIANT RefusalReasonsRight
INVARIANT NoRefusalWhenNegotiable
INVARIANT QueryOnlyWhenNegotiable
INVARIANT BothSidesAgree
INVARIANT NeverBothHaveAgency

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
PROPERTY ClientAcceptsOnlyProposed
PROPERTY AcceptCarriesNegotiatedData
PROPERTY UnorderedMapsRejected
