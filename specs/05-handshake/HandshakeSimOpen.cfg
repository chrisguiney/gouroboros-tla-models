\* Simultaneous open, reference behaviour: both sides read the other's
\* proposal as MsgReplyVersions and agree.
\* SPEC: HandshakeSimOpen.tla
SPECIFICATION SimSpec

CONSTANTS
    Versions = {1, 2}
    Magics = {0, 1}
    Mode = "NtN"
    SilentPeer = "None"
    RogueMessages = 0
    QueryFirst = FALSE
    StrictQueryReply = FALSE
    HandleReplyVersions = TRUE
    AcceptOwnData = FALSE
    CheckKeyOrder = TRUE
    UnorderedKeys = FALSE
    Mutation = "None"
    AsymmetricDecode = FALSE
    ReadsBeforeProposing = FALSE

INVARIANT SimTypeOK
INVARIANT NoViolations
INVARIANT SymmetricOutcome
INVARIANT SimAcceptsHighest
INVARIANT SameStateWhenQuiet

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
