\* SPEC: Handshake.tla
\* Reference behaviour with a client that may send its version table with
\* the keys out of order, and a rogue peer that may inject an unordered
\* MsgProposeVersions or MsgQueryReply (one magic keeps it small). Every
\* receiver hangs up on an unordered table; every other check still holds.
SPECIFICATION Spec

CONSTANTS
    Versions = {1, 2}
    Magics = {0}
    Mode = "NtN"
    SilentPeer = "None"
    RogueMessages = 1
    QueryFirst = FALSE
    StrictQueryReply = FALSE
    HandleReplyVersions = TRUE
    AcceptOwnData = FALSE
    CheckKeyOrder = TRUE
    UnorderedKeys = TRUE
    Mutation = "None"

INVARIANT TypeOK
INVARIANT AcceptsHighestCommon
INVARIANT AcceptsOnlyMatchingMagic
INVARIANT RefusalReasonsRight
INVARIANT NoRefusalWhenNegotiable
INVARIANT QueryOnlyWhenNegotiable
INVARIANT TimeoutsOnlyNtN

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
PROPERTY ClientAcceptsOnlyProposed
PROPERTY AcceptCarriesNegotiatedData
PROPERTY UnorderedMapsRejected
