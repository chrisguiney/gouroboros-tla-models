\* EXPECTED TO FAIL (deadlock). The server never answers, node-to-client:
\* the specification sets no timeouts, so the client waits forever. This is
\* by design; gOuroboros bounds the whole handshake in connection.go.
\* SPEC: Handshake.tla
SPECIFICATION Spec

CONSTANTS
    Versions = {1, 2}
    Magics = {0, 1}
    Mode = "NtC"
    SilentPeer = "Server"
    RogueMessages = 0
    QueryFirst = FALSE
    StrictQueryReply = FALSE
    HandleReplyVersions = TRUE
    AcceptOwnData = FALSE
    KeyOrderRule = "Recognised"
    ClientKeyOrders = "Ascending"
    Mutation = "None"

INVARIANT TypeOK
INVARIANT NoViolations
INVARIANT TimeoutsOnlyNtN

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
