\* gOuroboros after the query fix: the server negotiates before answering a
\* query, and the client still refuses a MsgQueryReply it did not ask for.
\* The strict client is harmless against an honest server.
\* SPEC: Handshake.tla
SPECIFICATION Spec

CONSTANTS
    Versions = {1, 2}
    Magics = {0, 1}
    Mode = "NtN"
    SilentPeer = "None"
    RogueMessages = 0
    QueryFirst = FALSE
    StrictQueryReply = TRUE
    HandleReplyVersions = TRUE
    Mutation = "None"

INVARIANT TypeOK
INVARIANT NoFailures
INVARIANT AcceptsHighestCommon
INVARIANT AcceptsOnlyMatchingMagic
INVARIANT RefusalReasonsRight
INVARIANT NoRefusalWhenNegotiable
INVARIANT QueryOnlyWhenNegotiable
INVARIANT BothSidesAgree
INVARIANT NeverBothHaveAgency

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
PROPERTY ClientAcceptsOnlyProposed
