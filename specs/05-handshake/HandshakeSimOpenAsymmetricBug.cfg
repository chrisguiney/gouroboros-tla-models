\* EXPECTED TO FAIL. One side sends data the other cannot decode: that side
\* refuses (and closes the connection) while the other accepts. Breaks
\* SymmetricOutcome; the specification allows this, as the refusing side
\* resets the connection.
\* SPEC: HandshakeSimOpen.tla
SPECIFICATION SimSpec

CONSTANTS
    Versions = {1, 2}
    Magics = {0, 1}
    Mode = "NtN"
    SilentPeer = "None"
    RogueMessages = 0
    QueryFirst = FALSE
    StrictQueryReply = FALSE
    HandleReplyVersions = TRUE
    Mutation = "None"
    AsymmetricDecode = TRUE
    ReadsBeforeProposing = FALSE

INVARIANT SymmetricOutcome
