\* SPEC: LeiosLedger.tla
\* LeiosLedgerGo on a longer chain (four blocks, seven slots), so a CertRB can
\* follow a rolled-back CertRB and a chain can certify twice. Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Txs = {"t1", "t2"}
    EbChoices <- DefaultEbs
    MaxSlot = 7
    CertDelay = 2
    EpochLength = 4
    MaxChain = 4
    RefSameEpoch = FALSE
    Impl = "go"
    GoCallerAppliesEb = TRUE
    Mutation = "none"
INVARIANTS
    TypeOK
    LedgerMatchesChain
    CertifiedChainWellFormed
    NoTxTwice
    EbAppliedAtMostOnce
    GoAgrees
