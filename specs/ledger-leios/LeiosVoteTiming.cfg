\* SPEC: LeiosVoteTiming.tla
\* Two elections, two seats, three announcing blocks, deadlines one tick
\* after each slot. Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Slots = {0, 1}
    Seats = {0, 1}
    Hashes = {"h1", "h2", "h3"}
    VoteHashes = {"h1", "h2"}
    W = 1
    MaxTime = 3
    MaxPending = 2
    Mutation = "none"
INVARIANTS
    TypeOK
    AtMostTwoAnnouncements
    NoLateVote
    OnlyAnnouncedVotes
    NeverRecordedTwice
    KeepsUnexpired
    CertsKeptUntilImmutable
