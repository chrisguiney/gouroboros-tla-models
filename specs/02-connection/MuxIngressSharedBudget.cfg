\* SPEC: MuxIngress.tla
\* Both protocols backpressured, a budget Bulk can fill, Bulk waiting on Ping. The empty-queue rule lets the Ping answer through.
SPECIFICATION Spec

CONSTANTS
    LimitBulk = 2
    LimitPing = 1
    Budget = 2
    Backpressure = {"Bulk", "Ping"}
    EmptyQueueAdmits = TRUE
    BulkWindow = 4
    Pings = 2
    Dependency = TRUE

INVARIANT NoOverflow
INVARIANT QueuesWithinLimits
