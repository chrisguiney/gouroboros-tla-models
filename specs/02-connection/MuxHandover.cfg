\* SPEC: MuxHandover.tla
\* gOuroboros as it is. Every message must reach a server instance, once, in order, and nothing may get stuck (TLC checks for deadlock).
SPECIFICATION Spec

CONSTANTS
    MaxPings = 2
    MaxRuns = 2
    CarryReadBuffer = TRUE
    AdmitOneAtATime = TRUE
    ResumeReceiver = TRUE
    Stopper = "None"

INVARIANT DeliveredInOrder
INVARIANT NoViolation
INVARIANT AtMostOneAdmitted
