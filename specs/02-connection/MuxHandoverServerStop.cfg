\* SPEC: MuxHandover.tla
\* Server.Stop at any moment, including mid-restart. Nothing reordered, nothing handled after Stop, nothing left reading or registered.
SPECIFICATION Spec

CONSTANTS
    MaxPings = 2
    MaxRuns = 2
    CarryReadBuffer = TRUE
    AdmitOneAtATime = TRUE
    ResumeReceiver = TRUE
    Stopper = "Server"

INVARIANT DeliveredInOrder NoViolation AtMostOneAdmitted NothingHandledAfterStop StopLeavesNothing
