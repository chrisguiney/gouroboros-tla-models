\* SPEC: MuxIngress.tla
\* The same unsized request with backpressure: the demuxer waits instead of failing. No overflow, no deadlock.
SPECIFICATION Spec

CONSTANTS
    LimitBulk = 2
    LimitPing = 1
    Budget = 3
    Backpressure = {"Bulk"}
    EmptyQueueAdmits = TRUE
    BulkWindow = 5
    Pings = 2
    Dependency = FALSE

INVARIANT NoOverflow
INVARIANT QueuesWithinLimits
