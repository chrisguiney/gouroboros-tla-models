\* SPEC: MuxIngress.tla
\* An honest peer: flow control keeps each protocol within its limit [M3]. Bulk's reader also waits on Ping answers. No overflow, no deadlock.
SPECIFICATION Spec

CONSTANTS
    LimitBulk = 2
    LimitPing = 1
    Budget = 3
    Backpressure = {}
    EmptyQueueAdmits = TRUE
    BulkWindow = 2
    Pings = 2
    Dependency = TRUE

INVARIANT NoOverflow
INVARIANT QueuesWithinLimits
