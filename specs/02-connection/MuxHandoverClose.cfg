\* SPEC: MuxHandover.tla
\* Connection shutdown at any moment, including mid-restart, with the fix for
\* issue 3085. Nothing reordered, refused, stuck, or handled after shutdown.
SPECIFICATION Spec

CONSTANTS
    MaxPings = 2
    MaxRuns = 2
    CarryReadBuffer = TRUE
    AdmitOneAtATime = TRUE
    ResumeReceiver = TRUE
    Stopper = "Connection"
    ShutdownStopsServer = TRUE

INVARIANT DeliveredInOrder NoViolation AtMostOneAdmitted
INVARIANT NothingHandledAfterStop
