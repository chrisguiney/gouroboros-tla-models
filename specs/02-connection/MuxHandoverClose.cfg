\* SPEC: MuxHandover.tla
\* Connection shutdown at any moment, including mid-restart. Nothing reordered or refused, and nothing gets stuck.
SPECIFICATION Spec

CONSTANTS
    MaxPings = 2
    MaxRuns = 2
    CarryReadBuffer = TRUE
    AdmitOneAtATime = TRUE
    ResumeReceiver = TRUE
    Stopper = "Connection"

INVARIANT DeliveredInOrder NoViolation AtMostOneAdmitted
