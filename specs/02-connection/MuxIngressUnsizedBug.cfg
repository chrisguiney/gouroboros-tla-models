\* SPEC: MuxIngress.tla
\* Intentionally fails: Bulk asked for more than it can hold, with no backpressure. Overflow: this is why gOuroboros switches backpressure on for unsized requests.
SPECIFICATION Spec

CONSTANTS
    LimitBulk = 2
    LimitPing = 1
    Budget = 3
    Backpressure = {}
    EmptyQueueAdmits = TRUE
    BulkWindow = 4
    Pings = 0
    Dependency = FALSE

INVARIANT NoOverflow
INVARIANT QueuesWithinLimits
