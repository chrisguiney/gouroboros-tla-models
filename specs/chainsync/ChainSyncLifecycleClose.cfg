\* SPEC: ChainSyncLifecycle.tla
\* The fix in review: Stop with requests unanswered closes the connection and Start refuses to restart.
SPECIFICATION Spec

CONSTANTS
    Limit = 2
    MaxRequests = 4
    MaxStarts = 2
    UseStop = TRUE
    UseDrain = TRUE
    StartRefusesAbandoned = TRUE
    CloseOnAbandon = TRUE

INVARIANT NoViolation
INVARIANT NoViolationOnLiveConnection
