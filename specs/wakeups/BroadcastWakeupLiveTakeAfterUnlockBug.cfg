\* SPEC: BroadcastWakeup.tla
\* Liveness under the late-take mutation: a parked waiter after a change never wakes
\* once the notifier has stopped.
SPECIFICATION FairSpec
\* Deadlock off: the lost-wakeup end state is not Finished; the property must fail on its own.
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxChanges = 2
    StoreOutsideLock = FALSE
    TakeAfterUnlock = TRUE
    CloseBeforeStore = FALSE
    Timer = FALSE
    Waiters = {w1, w2}
PROPERTY WakeupDelivered
