\* SPEC: BlockFetchClientDone.tla
\* gOuroboros main: a range requested before or after Stop queues
\* MsgClientDone is never written after it, every caller is released
\* (deadlock checking on: a stranded caller leaves no step), and the server
\* sees nothing its state forbids.
SPECIFICATION Spec
CONSTANTS
    Reqs = {1, 2, 3}
    EngineSendsInDone = FALSE
    NoShutdownDrain = FALSE
INVARIANT TypeOK
INVARIANT NoRequestAfterDone
INVARIANT ServerNeverViolated
INVARIANT QueueHoldsQueued
