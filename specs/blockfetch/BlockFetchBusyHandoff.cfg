\* SPEC: BlockFetchBusyHandoff.tla
\* The fix: Stop leaves each busy token to its own fetch, and Stop of a
\* never-started client stops that instance under lifecycleMutex. One fetch
\* at a time, Start's registration is never removed, every caller gives the
\* lock back, and the lock is free at the end (deadlock checking on).
SPECIFICATION FairSpec
CONSTANTS
    Fetches = {1, 2}
    MaxGen = 3
    StopReleasesBusy = FALSE
    StopsNeverStarted = TRUE
    StopNewLocked = TRUE
INVARIANT TypeOK
INVARIANT OneFetchAtATime
INVARIANT HolderIsInProgress
INVARIANT RegisteredWhileRunning
PROPERTY CallerAlwaysReleased
PROPERTY BusyEventuallyFree
