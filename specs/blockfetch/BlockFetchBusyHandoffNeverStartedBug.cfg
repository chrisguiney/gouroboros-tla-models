\* SPEC: BlockFetchBusyHandoff.tla
\* EXPECTED TO FAIL (first pass of the fix): Stop releases no token but
\* leaves a never-started instance alone. A fetch that sent on it before
\* Stop waits forever with the lock held, so no fetch after Start can take
\* it. Deadlock checking is off so the liveness property reports it.
SPECIFICATION FairSpec
CONSTANTS
    Fetches = {1, 2}
    MaxGen = 2
    StopReleasesBusy = FALSE
    StopsNeverStarted = FALSE
    StopNewLocked = TRUE
CHECK_DEADLOCK FALSE
INVARIANT OneFetchAtATime
INVARIANT RegisteredWhileRunning
PROPERTY CallerAlwaysReleased
