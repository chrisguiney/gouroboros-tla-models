\* SPEC: BlockFetchBusyDelivery.tla
\* Intentionally fails (two mutations): every resolve path takes its request
\* out of the queue under queueMutex first, so that alone gives exactly one
\* RangeDoneFunc and dropping resolveOnce changes nothing. Only when the
\* deadline watcher also resolves before removing do two goroutines both run
\* RangeDoneFunc for one request.
SPECIFICATION Spec

CONSTANTS
    Fixed = TRUE
    Stoppers = {"s1"}
    CbStop = {}
    CbRequestRange = TRUE
    WithSender = FALSE
    MaxDepth = 2
    ResolveUnderQueue = FALSE
    NoOnce = TRUE
    DeadlineResolvesQueued = TRUE
    EarlyDeferredCallback = FALSE
    SenderIgnoresDeferred = FALSE
    CbStopCtx = "none"
    JoinWatchers = FALSE

INVARIANT RangeDoneOnce
CHECK_DEADLOCK FALSE
