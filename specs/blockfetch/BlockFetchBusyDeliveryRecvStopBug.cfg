\* SPEC: BlockFetchBusyDelivery.tla
\* Intentionally fails: the first fix without SelfStop. A callback on recvLoop
\* (BlockFunc, or RangeDoneFunc from handleBatchDone) that calls Stop waits for
\* DoneChan, which closes only when recvLoop itself returns.
\* BlockFetchBusyDeliveryRecvStop.cfg passes with SelfStop.
SPECIFICATION Spec

CONSTANTS
    Fixed = TRUE
    Stoppers = {"s1"}
    CbStop = {"recv"}
    CbRequestRange = TRUE
    WithSender = FALSE
    MaxDepth = 2
    ResolveUnderQueue = FALSE
    NoOnce = FALSE
    DeadlineResolvesQueued = FALSE
    EarlyDeferredCallback = FALSE
    SenderIgnoresDeferred = FALSE
    SelfStop = FALSE
    JoinWatchers = FALSE

INVARIANT NoWaitCycle
