\* SPEC: BlockFetchBusyDelivery.tla
\* Intentionally fails, with the fix too: a callback on recvLoop (BlockFunc,
\* or RangeDoneFunc from handleBatchDone) that calls Stop waits for DoneChan,
\* which closes only when recvLoop itself returns.
SPECIFICATION Spec

CONSTANTS
    Fixed = TRUE
    Stoppers = {"s1"}
    CbStop = {"recv"}
    CbRequestRange = TRUE
    WithSender = FALSE
    MaxDepth = 2
    ResolveUnderQueue = FALSE
    NoOnce = FALSE
    DeadlineResolvesQueued = FALSE
    EarlyDeferredCallback = FALSE
    SenderIgnoresDeferred = FALSE

INVARIANT NoWaitCycle
