\* SPEC: BlockFetchAdmission.tla
\* gOuroboros main: three callers, one larger than the bound, one
\* unestimated. Every invariant holds and nothing deadlocks.
SPECIFICATION Spec
CONSTANTS
    Estimated = {1, 3}
    Bound = 4
    Max = 1
    NoRecheck = FALSE
    NoWake = FALSE
    StaleAllowance = FALSE
INVARIANT TypeOK
INVARIANT InFlightWithinBound
INVARIANT InFlightMatchesQueue
INVARIANT TokenConserved
INVARIANT NoLostWakeup
INVARIANT AllowanceMatchesQueue
