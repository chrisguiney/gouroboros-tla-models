\* SPEC: BlockFetchBusyDelivery.tla
\* Intentionally fails (mutation): if the deadline watcher resolved requests
\* before taking them out of the queue, recvLoop could wait for a deliveryMu
\* held by a callback that waits for lifecycleMutex, held by a Stop that
\* waits for queueMutex: hazard X1. Removing before deliveryMu rules it out.
SPECIFICATION Spec

CONSTANTS
    Fixed = FALSE
    Stoppers = {"s1", "s2"}
    CbStop = {"dl"}
    CbRequestRange = TRUE
    WithSender = FALSE
    MaxDepth = 2
    ResolveUnderQueue = FALSE
    NoOnce = FALSE
    DeadlineResolvesQueued = TRUE
    EarlyDeferredCallback = FALSE
    SenderIgnoresDeferred = FALSE

INVARIANT NoX1Shape
CHECK_DEADLOCK FALSE
