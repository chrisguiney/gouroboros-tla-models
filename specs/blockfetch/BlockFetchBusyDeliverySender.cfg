\* SPEC: BlockFetchBusyDelivery.tla
\* PR #3114's sendRequestRange composed with the fix: a request still
\* sending is left by drains to its sender, which resolves it after handing
\* back the token. One Stop; callbacks off recvLoop may call Stop or
\* RequestRange: every invariant holds and nothing deadlocks.
SPECIFICATION Spec

CONSTANTS
    Fixed = TRUE
    Stoppers = {"s1"}
    CbStop = {"s1", "s2", "dl", "sw", "snd"}
    CbRequestRange = TRUE
    WithSender = TRUE
    MaxDepth = 2
    ResolveUnderQueue = FALSE
    NoOnce = FALSE
    DeadlineResolvesQueued = FALSE
    EarlyDeferredCallback = FALSE
    SenderIgnoresDeferred = FALSE

INVARIANT NoWaitCycle
INVARIANT NoX1Shape
INVARIANT NoCallbackUnderLifecycle
INVARIANT NoCallbackUnderQueue
INVARIANT NoCallbackUnderToken
INVARIANT NoResolveDuringDelivery
INVARIANT RangeDoneOnce
INVARIANT AllResolvedAtEnd
