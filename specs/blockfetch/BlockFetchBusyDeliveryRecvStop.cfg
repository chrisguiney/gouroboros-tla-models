\* SPEC: BlockFetchBusyDelivery.tla
\* The fix plus StopContext: a callback on recvLoop that stops the client
\* with the context of its own CallbackContext requests shutdown and returns
\* without waiting for recvLoop, its own goroutine. Nothing deadlocks.
SPECIFICATION Spec

CONSTANTS
    Fixed = TRUE
    Stoppers = {"s1"}
    CbStop = {"recv"}
    CbRequestRange = TRUE
    WithSender = FALSE
    MaxDepth = 2
    ResolveUnderQueue = FALSE
    NoOnce = FALSE
    DeadlineResolvesQueued = FALSE
    EarlyDeferredCallback = FALSE
    SenderIgnoresDeferred = FALSE
    CbStopCtx = "own"
    JoinWatchers = FALSE
    RestartDuringStop = FALSE
    ScopedStopDrain = FALSE

INVARIANT NoWaitCycle
INVARIANT NoX1Shape
INVARIANT NoCallbackUnderLifecycle
INVARIANT NoCallbackUnderQueue
INVARIANT NoCallbackUnderToken
INVARIANT NoResolveDuringDelivery
INVARIANT RangeDoneOnce
INVARIANT AllResolvedAtEnd
