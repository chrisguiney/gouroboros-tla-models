\* SPEC: BlockFetchBusyDelivery.tla
\* Hazard X1 on main, with two Stops and every callback (recvLoop's too)
\* free to call Stop: the lifecycleMutex -> queueMutex -> deliveryMu ->
\* lifecycleMutex shape is never reached. Other invariants fail here and
\* other deadlocks happen (see the Bug configs), so only the shape is checked.
SPECIFICATION Spec

CONSTANTS
    Fixed = FALSE
    Stoppers = {"s1", "s2"}
    CbStop = {"s1", "s2", "recv", "dl", "sw", "snd"}
    CbRequestRange = TRUE
    WithSender = FALSE
    MaxDepth = 2
    ResolveUnderQueue = FALSE
    NoOnce = FALSE
    DeadlineResolvesQueued = FALSE
    EarlyDeferredCallback = FALSE
    SenderIgnoresDeferred = FALSE

INVARIANT NoX1Shape
CHECK_DEADLOCK FALSE
