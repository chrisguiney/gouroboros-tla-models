\* SPEC: BlockFetchBusyDelivery.tla
\* BlockFetchBusyDeliveryJoin with a Start between the running Stop's Unlock
\* and Relock, which queues request 4 on a new instance: the Stop's
\* unscoped failOutstanding resolves request 4 with the shutdown error.
SPECIFICATION Spec

CONSTANTS
    Fixed = TRUE
    Stoppers = {"s1", "s2"}
    CbStop = {"s1", "s2", "recv", "dl", "sw", "snd"}
    CbRequestRange = TRUE
    WithSender = FALSE
    MaxDepth = 2
    ResolveUnderQueue = FALSE
    NoOnce = FALSE
    DeadlineResolvesQueued = FALSE
    EarlyDeferredCallback = FALSE
    SenderIgnoresDeferred = FALSE
    CbStopCtx = "own"
    JoinWatchers = TRUE
    RestartDuringStop = TRUE
    ScopedStopDrain = FALSE

INVARIANT OldStopKeepsNewRequest
