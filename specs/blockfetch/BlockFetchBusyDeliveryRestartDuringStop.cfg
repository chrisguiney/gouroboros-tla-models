\* SPEC: BlockFetchBusyDelivery.tla
\* BlockFetchBusyDeliveryRestartDuringStopBug with ScopedStopDrain: the running
\* Stop drains only its own instance's requests, so request 4 stays queued;
\* every invariant of BlockFetchBusyDeliveryJoin holds as well.
SPECIFICATION Spec

CONSTANTS
    Fixed = TRUE
    Stoppers = {"s1", "s2"}
    CbStop = {"s1", "s2", "recv", "dl", "sw", "snd"}
    CbRequestRange = TRUE
    WithSender = FALSE
    MaxDepth = 2
    ResolveUnderQueue = FALSE
    NoOnce = FALSE
    DeadlineResolvesQueued = FALSE
    EarlyDeferredCallback = FALSE
    SenderIgnoresDeferred = FALSE
    CbStopCtx = "own"
    JoinWatchers = TRUE
    RestartDuringStop = TRUE
    ScopedStopDrain = TRUE

INVARIANT OldStopKeepsNewRequest
INVARIANT NoWaitCycle
INVARIANT NoX1Shape
INVARIANT NoCallbackUnderLifecycle
INVARIANT NoCallbackUnderQueue
INVARIANT NoCallbackUnderToken
INVARIANT NoResolveDuringDelivery
INVARIANT RangeDoneOnce
INVARIANT AllResolvedAtEnd
INVARIANT StopJoinsWatcher
