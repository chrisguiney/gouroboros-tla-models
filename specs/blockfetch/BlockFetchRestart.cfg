\* SPEC: BlockFetchRestart.tla
\* The fix: Start also waits for the old instance's goroutine group. Stop
\* contexts may end early and Start may run during a Stop; no old
\* callback runs after a restart, and nothing deadlocks.
SPECIFICATION Spec
CONSTANTS
    MaxGen = 3
    StopCtxMayExpire = TRUE
    ConcurrentStart = TRUE
    StartJoinsGroup = TRUE
    CbRestarts = FALSE
INVARIANT TypeOK
INVARIANT NoOldGenCallbackAfterStart
