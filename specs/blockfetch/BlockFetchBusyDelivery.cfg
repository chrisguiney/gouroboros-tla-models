\* SPEC: BlockFetchBusyDelivery.tla
\* gOuroboros main with one Stop and callbacks that return or call
\* RequestRange: every invariant holds and nothing deadlocks. The sender is
\* in BlockFetchBusyDeliverySender.cfg.
SPECIFICATION Spec

CONSTANTS
    Fixed = FALSE
    Stoppers = {"s1"}
    CbStop = {}
    CbRequestRange = TRUE
    WithSender = FALSE
    MaxDepth = 2
    ResolveUnderQueue = FALSE
    NoOnce = FALSE
    DeadlineResolvesQueued = FALSE
    EarlyDeferredCallback = FALSE
    SenderIgnoresDeferred = FALSE

INVARIANT NoWaitCycle
INVARIANT NoX1Shape
INVARIANT NoCallbackUnderLifecycle
INVARIANT NoCallbackUnderQueue
INVARIANT NoCallbackUnderToken
INVARIANT NoResolveDuringDelivery
INVARIANT RangeDoneOnce
INVARIANT AllResolvedAtEnd
