\* SPEC: BlockFetchBusyDelivery.tla
\* Intentionally fails (B1 as a deadlock, main): the RangeDoneFunc run under
\* lifecycleMutex calls Stop, which waits for the lock its own goroutine holds.
SPECIFICATION Spec

CONSTANTS
    Fixed = FALSE
    Stoppers = {"s1", "s2"}
    CbStop = {"s1", "s2", "dl", "sw", "snd"}
    CbRequestRange = TRUE
    WithSender = FALSE
    MaxDepth = 2
    ResolveUnderQueue = FALSE
    NoOnce = FALSE
    DeadlineResolvesQueued = FALSE
    EarlyDeferredCallback = FALSE
    SenderIgnoresDeferred = FALSE
    SelfStop = FALSE
    JoinWatchers = FALSE

INVARIANT NoWaitCycle
