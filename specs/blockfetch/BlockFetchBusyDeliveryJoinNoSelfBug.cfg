\* SPEC: BlockFetchBusyDelivery.tla
\* Intentionally fails: joining the watchers while callbacks call plain Stop.
\* A watcher's RangeDoneFunc that calls Stop then waits for its own goroutine.
SPECIFICATION Spec

CONSTANTS
    Fixed = TRUE
    Stoppers = {"s1"}
    CbStop = {"dl", "sw"}
    CbRequestRange = TRUE
    WithSender = FALSE
    MaxDepth = 2
    ResolveUnderQueue = FALSE
    NoOnce = FALSE
    DeadlineResolvesQueued = FALSE
    EarlyDeferredCallback = FALSE
    SenderIgnoresDeferred = FALSE
    CbStopCtx = "none"
    JoinWatchers = TRUE

INVARIANT NoWaitCycle
