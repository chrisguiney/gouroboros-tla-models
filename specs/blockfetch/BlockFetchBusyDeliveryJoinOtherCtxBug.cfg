\* SPEC: BlockFetchBusyDelivery.tla
\* Intentionally fails: StopContext compares the marker's identity. A callback
\* that passes another client's callback context is not recognized, so its
\* Stop waits for its own goroutine, as plain Stop would.
SPECIFICATION Spec

CONSTANTS
    Fixed = TRUE
    Stoppers = {"s1"}
    CbStop = {"recv", "dl", "sw"}
    CbRequestRange = TRUE
    WithSender = FALSE
    MaxDepth = 2
    ResolveUnderQueue = FALSE
    NoOnce = FALSE
    DeadlineResolvesQueued = FALSE
    EarlyDeferredCallback = FALSE
    SenderIgnoresDeferred = FALSE
    CbStopCtx = "other"
    JoinWatchers = TRUE

INVARIANT NoWaitCycle
