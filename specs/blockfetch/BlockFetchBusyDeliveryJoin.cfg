\* SPEC: BlockFetchBusyDelivery.tla
\* Both follow-ups: SelfStop, and every Stop not inside a callback joins the
\* shutdown and deadline watchers. Two Stops; every callback, recvLoop's too,
\* may call Stop or RequestRange: every invariant holds, StopJoinsWatcher too,
\* and nothing deadlocks.
SPECIFICATION Spec

CONSTANTS
    Fixed = TRUE
    Stoppers = {"s1", "s2"}
    CbStop = {"s1", "s2", "recv", "dl", "sw", "snd"}
    CbRequestRange = TRUE
    WithSender = FALSE
    MaxDepth = 2
    ResolveUnderQueue = FALSE
    NoOnce = FALSE
    DeadlineResolvesQueued = FALSE
    EarlyDeferredCallback = FALSE
    SenderIgnoresDeferred = FALSE
    SelfStop = TRUE
    JoinWatchers = TRUE

INVARIANT NoWaitCycle
INVARIANT NoX1Shape
INVARIANT NoCallbackUnderLifecycle
INVARIANT NoCallbackUnderQueue
INVARIANT NoCallbackUnderToken
INVARIANT NoResolveDuringDelivery
INVARIANT RangeDoneOnce
INVARIANT AllResolvedAtEnd
INVARIANT StopJoinsWatcher
