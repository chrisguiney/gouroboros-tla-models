\* SPEC: RewardPots.tla
\* The pledge check sums the owners' stake once per owner-list entry, as ValidatePoolPledge did, so a repeated owner meets a pledge the owner set does not. Expected: PledgeUnmetNoReward is violated.
CONSTANTS
    PV = 8
    MaxEpoch = 2
    Mutation = "SumOwnerList"
SPECIFICATION Spec
INVARIANTS
    PledgeUnmetNoReward
