\* SPEC: MuxReceiverStop.tla
\* gOuroboros main, the properties it keeps: the Cond loses no wakeup,
\* forward never parks after stop, no callback runs after Stop, and Stop
\* completes when a role is not registered twice (TestForwarderWakesOnEveryPredicateChange).
SPECIFICATION Spec
CONSTANTS
    NRecv = 2
    QMax = 1
    JoinFix = FALSE
    ReplaceFix = FALSE
    DoubleRegister = FALSE
    BroadcastOnStop = TRUE
    BroadcastOnEnqueue = TRUE
    StopWaits = TRUE
INVARIANT TypeOK
INVARIANT NoLostWakeup NoWaitAfterStop NoCallbackAfterStop StopCompletes
