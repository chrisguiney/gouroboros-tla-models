\* SPEC: TxSubmission.tla
\* NodeToNodeV_16, a rogue server against the fixed gOuroboros client that
\* also clamps: clamping loosens no other check. The client still refuses
\* everything the reference refuses, and its FIFO stays within the window.
SPECIFICATION Spec
CONSTANTS
    MaxUnacked = 2
    MaxIds = 4
    MaxRequests = 5
    V16 = TRUE
    ClientClamps = TRUE
    Server = "rogue"
    Client = "fixed"
    Mutation = "none"
INVARIANT ClientRefusesIllegal
INVARIANT ClientRefusesOnlyIllegal
INVARIANT ClampsOverWindow
INVARIANT ClientSendsLegal
INVARIANT BlockingRule
INVARIANT NonBlockingRule
INVARIANT WindowBound
