\* EXPECTED TO FAIL. Simultaneous open with a side whose version table holds
\* a pointer, against gOuroboros at 5826fae1: the agreement returns that
\* side's own entry, so the two sides can end with different diffusion
\* modes. Breaks SimAgreedData. Without the fix, the pointer case of
\* TestSimultaneousOpen fails.
\* SPEC: HandshakeSimOpen.tla
SPECIFICATION SimSpec

CONSTANTS
    Versions = {1, 2}
    Magics = {0, 1}
    Mode = "NtN"
    SilentPeer = "None"
    RogueMessages = 0
    QueryFirst = FALSE
    StrictQueryReply = FALSE
    HandleReplyVersions = TRUE
    AcceptOwnData = FALSE
    ServerRawPeerData = FALSE
    KeyOrderRule = "Recognised"
    ClientKeyOrders = "Ascending"
    Mutation = "PointerUnagreed"
    AsymmetricDecode = FALSE
    ReadsBeforeProposing = FALSE
    RawPeerData = FALSE

INVARIANT SimAgreedData
