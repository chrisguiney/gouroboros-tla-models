\* gOuroboros 7cd17437's version table (Peras field at 16, no 17) against the reference main, where 16 has four fields and Peras is at 17. Expected to fail: a gOuroboros client and a reference server agree 16 and the reference refuses the data with DecodeError.
\* SPEC: HandshakeVersionData.tla
SPECIFICATION Spec

CONSTANTS
    Family = "CardanoNtN"
    RefRev = "Main"
    GoPerasFrom = 16
    GoKnows17 = FALSE
    GoDMQRule = TRUE
    GoPeerSharingRange = TRUE
    GoClientAgrees = TRUE
    GoSkipsWideKeys = TRUE
    Mutation = "None"

INVARIANT TypeOK
INVARIANT AgreementMatchesReference
INVARIANT ServerMatchesReference
INVARIANT ClientMatchesReference
INVARIANT HonestPairsConnect
INVARIANT NeverAgreesUnproposed
INVARIANT BothEndAgreed
