\* table holds a pointer: the agreement returns the server's own entry, so
\* MsgAcceptVersion and the server's end data are not the agreed data.
\* Breaks AgreedDataBothSides. Without the fix, the pointer cases of
\* TestServerAcceptsWithNegotiatedVersionData fail.
\* SPEC: Handshake.tla
SPECIFICATION Spec

