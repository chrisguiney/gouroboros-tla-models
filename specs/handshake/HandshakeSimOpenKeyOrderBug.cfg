\* Simultaneous open with no key-order check (gOuroboros before the key-order
\* fix; the simultaneous-open branch decodes MsgReplyVersions with the same
\* NewMsgFromCbor, so it checks the order once both are in). Expected to fail
\* UnorderedMapsRejected.
\* SPEC: HandshakeSimOpen.tla
SPECIFICATION SimSpec

CONSTANTS
    Versions = {1, 2}
    Magics = {0, 1}
    Mode = "NtN"
    SilentPeer = "None"
    RogueMessages = 0
    QueryFirst = FALSE
    StrictQueryReply = FALSE
    HandleReplyVersions = TRUE
    AcceptOwnData = FALSE
    ServerRawPeerData = FALSE
    KeyOrderRule = "None"
    ClientKeyOrders = "Any"
    Mutation = "None"
    AsymmetricDecode = FALSE
    ReadsBeforeProposing = FALSE
    RawPeerData = FALSE

INVARIANT SimTypeOK
INVARIANT SymmetricOutcome
INVARIANT SimAcceptsHighest
INVARIANT SameStateWhenQuiet
INVARIANT SimAgreedData

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
PROPERTY UnorderedMapsRejected
