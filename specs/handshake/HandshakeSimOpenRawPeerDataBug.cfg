\* EXPECTED TO FAIL. Simultaneous open against gOuroboros at 78792c96: each
\* side ends with the peer's raw version data instead of the agreed data, so
\* with different diffusion modes the two sides end with opposite modes.
\* Breaks SimAgreedData. Without the fix, TestSimultaneousOpen's mixed
\* diffusion-mode case and TestSimultaneousOpenConnectionsMixedModes fail.
\* SPEC: HandshakeSimOpen.tla
SPECIFICATION SimSpec

CONSTANTS
    Versions = {1, 2}
    Magics = {0, 1}
    Mode = "NtN"
    SilentPeer = "None"
    RogueMessages = 0
    QueryFirst = TRUE
    StrictQueryReply = TRUE
    HandleReplyVersions = TRUE
    AcceptOwnData = TRUE
    KeyOrderRule = "None"
    ClientKeyOrders = "Ascending"
    Mutation = "None"
    AsymmetricDecode = FALSE
    ReadsBeforeProposing = FALSE
    RawPeerData = TRUE

INVARIANT SimAgreedData
