\* Simultaneous open against gOuroboros on branch
\* fix/handshake-simultaneous-open: the client takes the peer's
\* MsgProposeVersions as MsgReplyVersions, and Client.Start waits for its own
\* proposal before the connection reads, so no side reads in StPropose. The
\* gOuroboros query switches are on; neither side asks for a query here. Each
\* side ends with the agreed version data (RawPeerData = FALSE).
\* SPEC: HandshakeSimOpen.tla
SPECIFICATION SimSpec

CONSTANTS
    Versions = {1, 2}
    Magics = {0, 1}
    Mode = "NtN"
    SilentPeer = "None"
    RogueMessages = 0
    QueryFirst = TRUE
    StrictQueryReply = TRUE
    HandleReplyVersions = TRUE
    AcceptOwnData = TRUE
    KeyOrderRule = "None"
    ClientKeyOrders = "Ascending"
    Mutation = "None"
    AsymmetricDecode = FALSE
    ReadsBeforeProposing = FALSE
    RawPeerData = FALSE

INVARIANT SimTypeOK
INVARIANT NoViolations
INVARIANT SymmetricOutcome
INVARIANT SimAcceptsHighest
INVARIANT SameStateWhenQuiet
INVARIANT SimAgreedData

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
