\* Cardano node-to-node against the reference main: gOuroboros with the Peras field moved to version 17 and the fixes on (peer sharing range, client agreement, wide keys skipped).
\* SPEC: HandshakeVersionData.tla
SPECIFICATION Spec

CONSTANTS
    Family = "CardanoNtN"
    RefRev = "Main"
    GoPerasFrom = 17
    GoKnows17 = TRUE
    GoDMQRule = TRUE
    GoPeerSharingRange = TRUE
    GoClientAgrees = TRUE
    GoSkipsWideKeys = TRUE
    Mutation = "None"

INVARIANT TypeOK
INVARIANT AgreementMatchesReference
INVARIANT ServerMatchesReference
INVARIANT ClientMatchesReference
INVARIANT HonestPairsConnect
INVARIANT NeverAgreesUnproposed
INVARIANT BothEndAgreed
