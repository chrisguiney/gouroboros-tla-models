\* Simultaneous open, reference: recognised keys ascending, an unrecognised
\* key anywhere. Nobody hangs up.
\* SPEC: HandshakeSimOpen.tla
SPECIFICATION SimSpec

CONSTANTS
    Versions = {1, 2}
    Magics = {0, 1}
    Mode = "NtN"
    SilentPeer = "None"
    RogueMessages = 0
    QueryFirst = FALSE
    StrictQueryReply = FALSE
    HandleReplyVersions = TRUE
    AcceptOwnData = FALSE
    ServerRawPeerData = FALSE
    KeyOrderRule = "Recognised"
    ClientKeyOrders = "UnknownAnywhere"
    Mutation = "None"
    AsymmetricDecode = FALSE
    ReadsBeforeProposing = FALSE
    RawPeerData = FALSE

INVARIANT SimTypeOK
INVARIANT NoViolations
INVARIANT SymmetricOutcome
INVARIANT SimAcceptsHighest
INVARIANT SameStateWhenQuiet
INVARIANT SimAgreedData

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
PROPERTY UnknownKeysTolerated
