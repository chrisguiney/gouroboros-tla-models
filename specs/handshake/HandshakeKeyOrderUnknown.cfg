\* SPEC: Handshake.tla
\* Reference behaviour; the client lists its recognised keys ascending but
\* may put an unrecognised key anywhere, as the reference codec allows.
\* No side hangs up, and the unrecognised key is ignored.
SPECIFICATION Spec

CONSTANTS
    Versions = {1, 2}
    Magics = {0, 1}
    Mode = "NtN"
    SilentPeer = "None"
    RogueMessages = 0
    QueryFirst = FALSE
    StrictQueryReply = FALSE
    HandleReplyVersions = TRUE
    AcceptOwnData = FALSE
    ServerRawPeerData = FALSE
    KeyOrderRule = "Recognised"
    ClientKeyOrders = "UnknownAnywhere"
    Mutation = "None"

INVARIANT TypeOK
INVARIANT NoFailures
INVARIANT AcceptsHighestCommon
INVARIANT AcceptsOnlyMatchingMagic
INVARIANT RefusalReasonsRight
INVARIANT NoRefusalWhenNegotiable
INVARIANT QueryOnlyWhenNegotiable
INVARIANT BothSidesAgree

PROPERTY OnlyLegalMoves
PROPERTY UnorderedMapsRejected
PROPERTY UnknownKeysTolerated
