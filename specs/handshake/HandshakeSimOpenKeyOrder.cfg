\* Simultaneous open, reference: each side's proposal in any wire order, with
\* or without an unrecognised key. A side reading an unordered table hangs up
\* (NoViolations and SameStateWhenQuiet are not checked: a hostile order ends
\* one side in violation).
\* SPEC: HandshakeSimOpen.tla
SPECIFICATION SimSpec

CONSTANTS
    Versions = {1, 2}
    Magics = {0, 1}
    Mode = "NtN"
    SilentPeer = "None"
    RogueMessages = 0
    QueryFirst = FALSE
    StrictQueryReply = FALSE
    HandleReplyVersions = TRUE
    AcceptOwnData = FALSE
    ServerRawPeerData = FALSE
    KeyOrderRule = "Recognised"
    ClientKeyOrders = "Any"
    Mutation = "None"
    AsymmetricDecode = FALSE
    ReadsBeforeProposing = FALSE
    RawPeerData = FALSE

INVARIANT SimTypeOK
INVARIANT SymmetricOutcome
INVARIANT SimAcceptsHighest
INVARIANT SimAgreedData

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
PROPERTY UnorderedMapsRejected
PROPERTY UnknownKeysTolerated
