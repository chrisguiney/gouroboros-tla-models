\* SPEC: Handshake.tla
\* Reference behaviour with a client that may send its version table in any
\* wire order, with or without an unrecognised key, and a rogue peer that
\* may inject such a MsgProposeVersions or MsgQueryReply (one magic keeps it
\* small). Every receiver hangs up when its recognised keys are out of order
\* and only then; every other check still holds.
SPECIFICATION Spec

CONSTANTS
    Versions = {1, 2}
    Magics = {0}
    Mode = "NtN"
    SilentPeer = "None"
    RogueMessages = 1
    QueryFirst = FALSE
    StrictQueryReply = FALSE
    HandleReplyVersions = TRUE
    AcceptOwnData = FALSE
    ServerRawPeerData = FALSE
    KeyOrderRule = "Recognised"
    ClientKeyOrders = "Any"
    Mutation = "None"

INVARIANT TypeOK
INVARIANT AcceptsHighestCommon
INVARIANT AcceptsOnlyMatchingMagic
INVARIANT RefusalReasonsRight
INVARIANT NoRefusalWhenNegotiable
INVARIANT QueryOnlyWhenNegotiable
INVARIANT TimeoutsOnlyNtN

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
PROPERTY ClientAcceptsOnlyProposed
PROPERTY AcceptCarriesNegotiatedData
PROPERTY UnorderedMapsRejected
PROPERTY UnknownKeysTolerated
