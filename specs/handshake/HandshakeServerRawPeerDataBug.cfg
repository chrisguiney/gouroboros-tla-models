\* EXPECTED TO FAIL. gOuroboros with the accept fix at 77deeda7: the server
\* sends the agreed data in MsgAcceptVersion but ends with the client's raw
\* data, so an initiator-only server facing a full-duplex client derives a
\* full-duplex muxer while the client does not. Breaks AgreedDataBothSides.
\* SPEC: Handshake.tla
SPECIFICATION Spec

CONSTANTS
    Versions = {1, 2}
    Magics = {0, 1}
    Mode = "NtN"
    SilentPeer = "None"
    RogueMessages = 0
    QueryFirst = FALSE
    StrictQueryReply = TRUE
    HandleReplyVersions = TRUE
    AcceptOwnData = FALSE
    ServerRawPeerData = TRUE
    KeyOrderRule = "Recognised"
    ClientKeyOrders = "Ascending"
    Mutation = "None"

INVARIANT AgreedDataBothSides
