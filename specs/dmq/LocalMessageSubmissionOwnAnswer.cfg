\* SPEC: LocalMessageSubmission.tla
\* Two concurrent calls; SubmitMessage returns its own answer under the
\* client's submit lock, as the reference's submit continuation does.
SPECIFICATION Spec

CONSTANTS
    Calls = {"a", "b"}
    Serialised = FALSE
    TaggedAnswers = FALSE
    UseStop = TRUE
    NoAgencyWait = FALSE
    OwnAnswer = TRUE
    OwnAnswerLock = TRUE

INVARIANT NoViolation
INVARIANT AnswerReachesAsker
