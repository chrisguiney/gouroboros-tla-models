\* SPEC: LocalMessageSubmission.tla
\* A late call after Stop is refused without queueing, and callbacks run on
\* the submitting goroutine after the lock is released, so a callback may
\* submit again.
SPECIFICATION Spec

CONSTANTS
    Calls = {"a", "b", "cb"}
    Serialised = FALSE
    TaggedAnswers = FALSE
    UseStop = TRUE
    NoAgencyWait = FALSE
    OwnAnswer = TRUE
    OwnAnswerLock = TRUE
    LateCalls = {"b"}
    RefuseAfterStop = TRUE
    CallbackCall = "cb"
    CallbackOnCaller = TRUE

INVARIANT NoViolation
INVARIANT AnswerReachesAsker
