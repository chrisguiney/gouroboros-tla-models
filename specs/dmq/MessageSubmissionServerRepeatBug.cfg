\* SPEC: MessageSubmission.tla
\* EXPECTED TO FAIL (current gOuroboros Server): the Server's own RequestMessages repeats an id, which a refusing outbound (dmq-node V2) rejects.
SPECIFICATION Spec

CONSTANTS
    Version = 2
    MaxUnacked = 2
    MaxIds = 4
    Rogue = FALSE
    OutRefusesRepeat = TRUE
    InRefusesRepeat = FALSE
    RolesMatch = TRUE
    NoIdsReply = TRUE
    MaxRuns = 1
    ForgetAskedOnRestart = TRUE
    PeerPipelines = FALSE
    OutAdmitsPipelined = FALSE
    OutAdmitsPipelinedBodies = FALSE
    Mutation = "none"

INVARIANT HonestNeverRefused
