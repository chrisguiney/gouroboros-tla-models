\* SPEC: LocalMessageNotification.tla
\* The server restarts after MsgClientDone; the application waits across
\* the restart and WaitForMessage watches only the server's own Stop and
\* the connection (the fix), with the broadcast wakeup.
SPECIFICATION Spec

CONSTANTS
    MaxAdds = 2
    MaxRequests = 2
    AppWaits = TRUE
    Broadcast = TRUE
    Unbuffered = FALSE
    RogueServer = FALSE
    ClientRefusesEmpty = FALSE
    ServerRestarts = TRUE
    RestartReleasesWaiters = FALSE

INVARIANT WakeupNotLost
INVARIANT NoEmptyBlocking
INVARIANT AppWaitOutlivesRun
