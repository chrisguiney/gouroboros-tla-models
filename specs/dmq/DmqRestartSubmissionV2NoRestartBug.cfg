\* SPEC: DmqRestart.tla
\* A DEVIATION (gOuroboros 7cd17437). Intentionally fails by NewRunServed: the V2 responder (the gOuroboros messagesubmission Client type) stays in StDone after the requester's MsgDone, so the second run's first request is never read.
SPECIFICATION Spec

CONSTANTS
    Proto = "SubmissionV2"
    MaxRuns = 2
    MaxMsgs = 7
    ServerRestarts = FALSE
    IdleTimeout = "WithinRun"

INVARIANT TypeOK
INVARIANT NoViolation
INVARIANT NewRunServed
