\* SPEC: AuthOpCertCache.tla
\* gOuroboros 7cd17437: VerifyMessageWithSlot writes the counter before the rate
\* re-check refuses the message, so CacheIsMaxAccepted fails (TestVerifyMessageWithSlotRefusedRecordsNoCounter).
SPECIFICATION Spec
CONSTANTS
    Workers = {1, 2}
    Delay = 1
    MaxT = 2
    HeldFirst = TRUE
    Direct = TRUE
    Mutation = "None"
INVARIANTS
    TypeOK DuplicateNeverRefused CacheIsMaxAccepted CounterNeverBackwards
PROPERTY
    CacheMonotonic
