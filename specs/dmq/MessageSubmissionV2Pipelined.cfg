\* SPEC: MessageSubmission.tla
\* V2 against the reference pipelined requester: the outbound holds
\* the pipelined request for ids until it has replied. Passes.
SPECIFICATION Spec

CONSTANTS
    Version = 2
    MaxUnacked = 2
    MaxIds = 4
    Rogue = FALSE
    OutRefusesRepeat = TRUE
    InRefusesRepeat = TRUE
    RolesMatch = TRUE
    NoIdsReply = TRUE
    MaxRuns = 1
    ForgetAskedOnRestart = TRUE
    PeerPipelines = TRUE
    OutAdmitsPipelined = TRUE
    OutAdmitsPipelinedBodies = TRUE
    Mutation = "none"

INVARIANT WindowBound ViewsAgree BlockingRule NoRepeatServe HonestNeverRefused
