\* SPEC: DmqRestart.tla
\* The reference [R11][R13] (and gOuroboros test/leios-dmq-lifecycle): two runs of SubmissionV2 on one connection. The requesting side (the gOuroboros Server type) ends the first run with MsgDone; the responder (the gOuroboros Client type) restarts, so every message of the second run is read; the Idle timer is off from MsgDone until the next request (f608affe), so a long demotion does not time the connection out. Passes.
SPECIFICATION Spec

CONSTANTS
    Proto = "SubmissionV2"
    MaxRuns = 2
    MaxMsgs = 7
    ServerRestarts = TRUE
    IdleTimeout = "WithinRun"

INVARIANT TypeOK
INVARIANT NoViolation
INVARIANT NewRunServed
INVARIANT NoTimeoutBetweenRuns
