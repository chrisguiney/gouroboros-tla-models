\* SPEC: DmqRestart.tla
\* The reference [R11][R13] (and gOuroboros test/leios-dmq-lifecycle): two runs of SubmissionV2 on one connection. The requesting side (the gOuroboros Server type) ends the first run with MsgDone; the responder (the gOuroboros Client type) restarts, so every message of the second run is read. Passes.
SPECIFICATION Spec

CONSTANTS
    Proto = "SubmissionV2"
    MaxRuns = 2
    MaxMsgs = 7
    ServerRestarts = TRUE

INVARIANT TypeOK
INVARIANT NoViolation
INVARIANT NewRunServed
