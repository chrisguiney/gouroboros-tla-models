\* SPEC: MessageSubmission.tla
\* V1, the gOuroboros Server asking again for a body the peer omitted, against a V1 outbound that refuses a repeat only within one request (ouroboros-network TxSubmission/Outbound.hs): it is never refused.
SPECIFICATION Spec

CONSTANTS
    Version = 1
    MaxUnacked = 2
    MaxIds = 4
    Rogue = FALSE
    OutRefusesRepeat = FALSE
    InRefusesRepeat = FALSE
    RolesMatch = TRUE
    NoIdsReply = TRUE
    MaxRuns = 1
    ForgetAskedOnRestart = TRUE
    PeerPipelines = FALSE
    OutAdmitsPipelined = FALSE
    OutAdmitsPipelinedBodies = FALSE
    Mutation = "none"

INVARIANT WindowBound ViewsAgree BlockingRule HonestNeverRefused AskedInWindow
