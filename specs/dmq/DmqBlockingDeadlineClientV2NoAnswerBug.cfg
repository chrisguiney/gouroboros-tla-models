\* SPEC: DmqBlockingDeadline.tla
\* V2: the Client's application never answers with none. dmq-node's inbound gives
\* up after 20 s: fails NoTimeoutOfConformingPeer. The application must call
\* ReplyNoMessageIds in time; gOuroboros does not answer for it.
SPECIFICATION Spec

CONSTANTS
    IdleWait = 10
    IdleLimit = 300
    WaitLimit = 20
    AnswerNoneAt = 0
    Arrivals = {5, 25, 45}
    Never = 1000

INVARIANT TypeOK
INVARIANT NoTimeoutOfConformingPeer
