\* SPEC: DmqBlockingDeadline.tla
\* V1 on gOuroboros 7cd17437: the gOuroboros Server times a blocking request at
\* 30 s; dmq-node's V1 outbound waits for an id and has no empty answer.
\* Fails NoTimeoutOfConformingPeer when no message arrives within 30 s.
SPECIFICATION Spec

CONSTANTS
    IdleWait = 0
    IdleLimit = 0
    WaitLimit = 30
    AnswerNoneAt = 0
    Arrivals = {5, 25, 45}
    Never = 1000

INVARIANT TypeOK
INVARIANT NoTimeoutOfConformingPeer
