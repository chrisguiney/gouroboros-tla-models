\* SPEC: DmqRestart.tla
\* gOuroboros 95f5396d (the V2 restart fix before f608affe). Intentionally fails by NoTimeoutBetweenRuns: the restarted responder keeps StIdle's timeout after MsgDone, so a peer demoted for longer than the timeout gets the connection torn down while it is legitimately idle.
SPECIFICATION Spec

CONSTANTS
    Proto = "SubmissionV2"
    MaxRuns = 2
    MaxMsgs = 7
    ServerRestarts = TRUE
    IdleTimeout = "Always"

INVARIANT TypeOK
INVARIANT NoViolation
INVARIANT NewRunServed
INVARIANT NoTimeoutBetweenRuns
