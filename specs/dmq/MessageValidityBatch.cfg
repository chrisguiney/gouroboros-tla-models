\* SPEC: MessageValidity.tla
\* Two workers, two-message batches over two pools: prepare and commit agree with the reference's one-at-a-time rule once commit re-checks every counter.
SPECIFICATION Spec

CONSTANTS
    Pools = {"p", "q"}
    Staked = {"p", "q"}
    ChainFloor = 0
    Counters = {0, 1, 2}
    CertPeriods = {0}
    MsgPeriods = {0}
    SigEvos = {0}
    Exps = {0}
    Bodies = {"ok"}
    MaxEvo = 2
    TTL = 1
    MaxTicks = 0
    MaxPeriod = 0
    Workers = {1, 2}
    BatchLen = 2
    Mutation = "none"

INVARIANT NoAcceptBeyondReference AcceptAsReference
PROPERTY SeenMonotone RejectKeepsSeen
