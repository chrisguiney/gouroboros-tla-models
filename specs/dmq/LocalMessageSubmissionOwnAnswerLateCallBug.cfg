\* SPEC: LocalMessageSubmission.tla
\* EXPECTED TO FAIL (deadlock). A call made after Stop queues its message
\* behind MsgDone; in StDone nothing more is sent, so it waits forever
\* holding the submit lock.
SPECIFICATION Spec

CONSTANTS
    Calls = {"a", "b"}
    Serialised = FALSE
    TaggedAnswers = FALSE
    UseStop = TRUE
    NoAgencyWait = FALSE
    OwnAnswer = TRUE
    OwnAnswerLock = TRUE
    LateCalls = {"b"}
    RefuseAfterStop = FALSE
    CallbackCall = "none"
    CallbackOnCaller = FALSE

INVARIANT NoViolation
