    Ids = {"a", "b"}
    FailSets = {{}, {"expired"}, {"badsize", "expired"}, {"unregistered"}, {"badsig"}, {"toofar"}, {"kesWindow", "unregistered"}, {"badsig", "unregistered"}, {"counter", "badsig"}}
    Delay = 0
    MaxTicks = 3
    Workers = {1, 2}
    Mutation = "none"

INVARIANT OutcomeAsReference ReverifyAccepted DuplicateNotFatal OffNeverRefused
