\* SPEC: LocalMessageSubmission.tla
\* EXPECTED TO FAIL (deadlock). An accept callback that submits again runs
\* on the receive loop while its caller holds the submit lock: the new call
\* waits for the lock, and the lock waits for the callback.
SPECIFICATION Spec

CONSTANTS
    Calls = {"a", "cb"}
    Serialised = FALSE
    TaggedAnswers = FALSE
    UseStop = TRUE
    NoAgencyWait = FALSE
    OwnAnswer = TRUE
    OwnAnswerLock = TRUE
    LateCalls = {}
    RefuseAfterStop = FALSE
    CallbackCall = "cb"
    CallbackOnCaller = FALSE

INVARIANT NoViolation
