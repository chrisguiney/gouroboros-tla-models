\* SPEC: MessageSubmission.tla
\* V2 against the reference pipelined requester, b6b0cfd1: a request
\* for bodies pipelined behind an unanswered non-blocking request for
\* ids or request for bodies is refused by the outbound's state map.
\* Expected: HonestNeverRefused fails.
SPECIFICATION Spec

CONSTANTS
    Version = 2
    MaxUnacked = 2
    MaxIds = 4
    Rogue = FALSE
    OutRefusesRepeat = TRUE
    InRefusesRepeat = TRUE
    RolesMatch = TRUE
    NoIdsReply = TRUE
    MaxRuns = 1
    ForgetAskedOnRestart = TRUE
    PeerPipelines = TRUE
    OutAdmitsPipelined = TRUE
    OutAdmitsPipelinedBodies = FALSE
    Mutation = "none"

INVARIANT WindowBound ViewsAgree BlockingRule NoRepeatServe HonestNeverRefused
