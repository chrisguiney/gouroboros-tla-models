\* SPEC: DmqRestart.tla
\* A DEVIATION (gOuroboros main d8f5bc2a). Intentionally fails by NewRunServed: the LocalSubmission server stays in StDone after MsgDone, so the second run's first message is never read.
SPECIFICATION Spec

CONSTANTS
    Proto = "LocalSubmission"
    MaxRuns = 2
    MaxMsgs = 6
    ServerRestarts = FALSE
    IdleTimeout = "WithinRun"

INVARIANT TypeOK
INVARIANT NoViolation
INVARIANT NewRunServed
