\* SPEC: BlockPipeline.tla
\* Passes (WithLosslessResults): a reader receives every committed block in order, nothing is dropped before Stop, and nothing deadlocks.
SPECIFICATION Spec
CONSTANTS
    N = 4
    MaxPending = 2
    CapacityBound = 2
    QueueCap = 1
    Consumer = TRUE
    CanFail = TRUE
    StopAllowed = TRUE
    DrainWaitsForApply = TRUE
    FailStops = TRUE
    ResultsNonBlocking = TRUE
    LosslessResults = TRUE
INVARIANTS
    TypeOK AppliedInOrderOnce CompletedMeansApplied NoApplyAfterFailure PendingBounded NoCommitAfterRollback ReadInCommitOrder ReadLosslessWithoutDrops LosslessNeverDropsBeforeStop
