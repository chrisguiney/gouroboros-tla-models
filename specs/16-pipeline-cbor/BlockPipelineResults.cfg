\* SPEC: BlockPipeline.tla
\* Passes (fix): a consumer reads Results while blocks may fail and Stop may happen; reads stay in commit order, and lossless until a drop.
SPECIFICATION Spec
CONSTANTS
    N = 4
    MaxPending = 2
    CapacityBound = 2
    QueueCap = 2
    Consumer = TRUE
    CanFail = TRUE
    StopAllowed = TRUE
    DrainWaitsForApply = TRUE
    FailStops = TRUE
    ResultsNonBlocking = TRUE
    LosslessResults = FALSE
INVARIANTS
    TypeOK AppliedInOrderOnce CompletedMeansApplied NoApplyAfterFailure PendingBounded NoCommitAfterRollback ReadInCommitOrder ReadLosslessWithoutDrops
