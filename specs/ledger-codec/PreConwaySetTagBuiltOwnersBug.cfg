\* SPEC: PreConwaySetTag.tla
\* e82a8a6c [G1]: a built Shelley to Babbage pool registration writes its owner set under tag 258, which the decoder then refuses ("pool owner set is tagged before Conway"). Expected: BuiltOwnersRoundTrip is violated.
CONSTANTS
    Rule = "anyTag"
    Tags = {"none", "258", "other"}
SPECIFICATION Spec
INVARIANTS
    SetTagAsReference
    BuiltOwnersRoundTrip
