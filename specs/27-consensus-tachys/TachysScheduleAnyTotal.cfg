\* SPEC: TachysSchedule.tla
\* The caller may declare any total; gOuroboros refuses every wrong one,
\* so whatever it builds is still the specification's schedule.
\* Expected: every invariant except BuildAgrees (a wrong total is the caller's error) holds.
CONSTANTS
    Pools = {1, 2, 3}
    MaxStake = 2
    D = 4
    Nonces = {1}
    Slots = {0, 1}
    WordMax = 6
    ZeroStake = "Filter"
    Declared = "Any"
    GoZero = "Reject"
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    ExactlyOneLeader
    LeaderDefined
    LeaderAgrees
    WidthEqualsStake
    Proportional
    ZeroStakeNeverLeads
    SameInputsSameLeader
    ValidatorExact
    ForgeMatchesValidate
