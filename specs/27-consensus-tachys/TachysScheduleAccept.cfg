\* SPEC: TachysSchedule.tla
\* The CIP's reading: the caller passes the reference PoolDistr verbatim
\* (zero-stake pools included) and gOuroboros gives them empty intervals.
\* Expected: every invariant holds, so filtering and accepting are equivalent.
CONSTANTS
    Pools = {1, 2, 3}
    MaxStake = 2
    D = 4
    Nonces = {1}
    Slots = {0, 1}
    WordMax = 6
    ZeroStake = "Pass"
    Declared = "Exact"
    GoZero = "Accept"
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    BuildAgrees
    ExactlyOneLeader
    LeaderDefined
    LeaderAgrees
    WidthEqualsStake
    Proportional
    ZeroStakeNeverLeads
    SameInputsSameLeader
    ValidatorExact
    ForgeMatchesValidate
