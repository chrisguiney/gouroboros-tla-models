\* Mutation: POOLREAP runs before SNAP, so the mark snapshot sees a new VRF
\* key one epoch early. Expected: VrfKeyDelay fails.
\* SPEC: StakeSnapshots.tla
CONSTANTS
    MaxEpoch = 6
    MaxStake = 1
    MaxKeys = 3
    LeaderSource = "Set"
    Mutation = "ReapFirst"
SPECIFICATION Spec
INVARIANTS
    VrfKeyDelay
