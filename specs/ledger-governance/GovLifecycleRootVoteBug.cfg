\* SPEC: GovLifecycle.tla
\* EXPECTED TO FAIL: GovActionById answers for a purpose's current root, so a vote on an enacted action is accepted.
SPECIFICATION Spec

CONSTANTS
    N = 3
    MaxEpoch = 3
    Lifetime = 2
    CheckAncestry = TRUE
    LiveOnlyLookup = TRUE
    RootNotLive = FALSE
    ThreadRoot = TRUE
    Delay = TRUE
    PruneAfterExpiry = TRUE

INVARIANT TypeOK
INVARIANT TreeWellFormed
INVARIANT EnactedPrevMatchesRoot
INVARIANT DelayingIsLast
INVARIANT DepositsReturnedOnce
INVARIANT VotesOnlyLive
INVARIANT SpecAgrees
