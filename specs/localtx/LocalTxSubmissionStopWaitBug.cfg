\* SPEC: LocalTxSubmission.tla
\* THE BUG (gOuroboros client at PR 3140 head 18f07468, against the node).
\* Intentionally fails: StopNeverWaitsOnPeer is violated. With no default
\* timeout, SubmitTx holds busyMutex while the node holds MsgSubmitTx for a
\* full mempool; Stop() takes the same mutex before it can act, so only
\* the node's answer would let Stop return. The fix (641eff0a) is
\* StopCancelsWait = TRUE.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 1
    MaxSubmits = 1
    MaxFlips = 1
    RogueMessages = 0
    ClientTimeouts = FALSE
    SerialCalls = TRUE
    StopCancelsWait = FALSE
    ServerRestarts = FALSE
    ReuseAfterClose = FALSE
    CloseConnection = FALSE
    PrintTable = FALSE

INVARIANT StopNeverWaitsOnPeer
