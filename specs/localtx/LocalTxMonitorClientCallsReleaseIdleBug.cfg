\* SPEC: LocalTxMonitorClientCalls.tla
\* Defect: Release() from StIdle sends MsgRelease, which the client's own
\* send loop refuses, tearing the connection down while Release returns
\* nil. Intentionally fails NoIllegalSend.
SPECIFICATION Spec

CONSTANTS
    MaxCalls = 3
    ReleaseChecksAcquired = FALSE
    MeasuresChecksStop = TRUE
    StopReleases = TRUE
    ReleaseClearsFlag = TRUE

INVARIANT NoIllegalSend
