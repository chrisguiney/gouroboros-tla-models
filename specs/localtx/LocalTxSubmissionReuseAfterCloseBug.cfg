\* SPEC: LocalTxSubmission.tla
\* gOuroboros ffc14012: Stop cancels a SubmitTx the node still holds and
\* closes the protocol without MsgDone, but the connection stays open. A new
\* client on the same connection then reads the held answer as the answer
\* to its own submission, or reads it in StIdle and drops the connection.
\* Expected: NeverBothHaveAgency fails (the new client in StIdle while the
\* server is still in StBusy).
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 2
    MaxSubmits = 2
    MaxFlips = 1
    RogueMessages = 0
    ClientTimeouts = FALSE
    SerialCalls = TRUE
    StopCancelsWait = TRUE
    ServerRestarts = TRUE
    ReuseAfterClose = TRUE
    CloseConnection = FALSE
    PrintTable = FALSE

INVARIANT TypeOK
INVARIANT NoFailures
INVARIANT AnswersReachTheirCallers
INVARIANT NeverBothHaveAgency
