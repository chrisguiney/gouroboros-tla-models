\* SPEC: LocalTxMonitor.tla
\* THE BUG (gOuroboros client against the node). Intentionally fails.
\* gOuroboros's Acquire() from StAcquired sends MsgAwaitAcquire (the same
\* bytes as MsgAcquire); the node holds the answer until the mempool changes,
\* and the client's AcquireTimeout (5 s by default) tears the connection down.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 1
    MaxQueries = 1
    MaxChanges = 1
    RogueMessages = 0
    BusyKinds = TRUE
    AwaitWaitsForChange = TRUE
    ClientTimeouts = TRUE
    StopReleases = TRUE
    StopCancelsWait = TRUE
    ClientSendsMeasures = FALSE
    ServerKnowsMeasures = TRUE
    ServerRestarts = FALSE
    ClientChecksVersion = TRUE
    NegotiatedV20 = TRUE
    PrintTable = FALSE

INVARIANT NoFailures
