\* SPEC: LocalTxSubmission.tla
\* The reference: a reference client and the node's server. Two runs, two
\* transactions, and a mempool that may fill up and drain. Everything should
\* work, every time.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 2
    MaxSubmits = 2
    MaxFlips = 2
    RogueMessages = 0
    ClientTimeouts = FALSE
    SerialCalls = TRUE
    StopCancelsWait = TRUE
    ServerRestarts = TRUE
    ReuseAfterClose = FALSE
    CloseConnection = FALSE
    PrintTable = FALSE

INVARIANT TypeOK
INVARIANT NoFailures
INVARIANT AnswersReachTheirCallers
INVARIANT NeverBothHaveAgency
INVARIANT OneSubmitInFlight
INVARIANT NewRunServed
INVARIANT StopNeverWaitsOnPeer

PROPERTY FailuresAreFinal
