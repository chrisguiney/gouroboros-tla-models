    MaxRuns = 2
    MaxSubmits = 2
    MaxFlips = 1
    RogueMessages = 0
    ClientTimeouts = FALSE
    SerialCalls = TRUE
    StopCancelsWait = TRUE
    ServerRestarts = TRUE
    ReuseAfterClose = TRUE
    CloseConnection = TRUE
    PrintTable = FALSE

INVARIANT TypeOK
INVARIANT NoFailures
INVARIANT AnswersReachTheirCallers
INVARIANT NeverBothHaveAgency
