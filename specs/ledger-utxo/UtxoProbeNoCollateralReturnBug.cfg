\* SPEC: Utxo.tla
\* Probe: an invalid transaction creates its collateral return. Expected: ProbeNoCollateralReturn is violated.
SPECIFICATION Spec
CONSTANTS
    Era = "Babbage"
    MinFee = 1
    MinUtxo = 1
    KeyDeposit = 1
    CollPct = 150
    MaxColl = 2
    StartUtxo <- LedgerStart
    MaxTxs = 2
    Mutation = "none"
INVARIANTS
    ProbeNoCollateralReturn
