\* SPEC: Utxo.tla
\* Probe: Babbage accepts a reference input that is also spent. Expected: ProbeNoOverlapAccepted is violated.
SPECIFICATION TableSpec
CONSTANTS
    Era = "Babbage"
    MinFee = 1
    MinUtxo = 1
    KeyDeposit = 1
    CollPct = 150
    MaxColl = 2
    StartUtxo <- LedgerStart
    MaxTxs = 0
    Mutation = "none"
INVARIANTS
    ProbeNoOverlapAccepted
