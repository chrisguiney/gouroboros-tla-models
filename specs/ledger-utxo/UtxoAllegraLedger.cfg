\* SPEC: Utxo.tla
\* Allegra: the reference's rules, applied transaction after transaction,
\* preserve ada and tokens and leave kept outputs alone.
\* Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Era = "Allegra"
    MinFee = 1
    MinUtxo = 1
    KeyDeposit = 1
    CollPct = 150
    MaxColl = 2
    StartUtxo <- LedgerStart
    MaxTxs = 3
    Mutation = "none"
INVARIANTS
    TypeOK
    ValuePreserved
    TokensPreserved
    KeptUnspent
