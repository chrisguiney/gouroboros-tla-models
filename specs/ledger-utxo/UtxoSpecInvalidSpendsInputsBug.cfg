\* SPEC: Utxo.tla
\* Mutation: a phase-2-invalid transaction spends its inputs as well.
\* Expected: KeptUnspent fails.
SPECIFICATION Spec
CONSTANTS
    Era = "Alonzo"
    MinFee = 1
    MinUtxo = 1
    KeyDeposit = 1
    CollPct = 150
    MaxColl = 2
    StartUtxo <- LedgerStart
    MaxTxs = 3
    Mutation = "SpecInvalidSpendsInputs"
INVARIANTS
    KeptUnspent
