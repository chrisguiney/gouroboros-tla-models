\* SPEC: HashCacheSpin.tla
\* Passes: SetCbor breaks its contract and races Get. Storing the bytes before
\* Reset still never leaves a stale Ready object in the pointer. A racing Get
\* may return either hash, so ReturnsCurrentHash is not checked here.
SPECIFICATION FairSpec
CONSTANTS
    Callers = {"g1", "g2"}
    MaxCalls = 2
    MaxPanics = 1
    ComputeMode = "returns"
    MaxSetCbor = 1
    SetCborMode = "racing"
    Mutation = "None"
INVARIANTS
    TypeOK AtMostOneComputer ComputeOncePerObject NoRacyRead NoReturnBeforeReady NoOrphanComputing CachedMatchesBytes
PROPERTY
    WaitersReturn
