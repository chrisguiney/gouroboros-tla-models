\* SPEC: PooledEvalContext.tla
\* EXPECTED TO FAIL (mutation): the Machine pool is keyed by the EvalContext address,
\* so a new EvalContext at a freed address takes the old one's Machines.
SPECIFICATION Spec
CONSTANTS
    Evaluators = {"e1", "e2"}
    Tuples = {"A", "B"}
    Rounds = 3
    Limit = 1
    MaxCtx = 4
    MaxM = 3
    Mutation = "PoolByAddress"
CHECK_DEADLOCK FALSE
INVARIANTS
    MachineExclusive NoCrossTupleMachine ContextMatchesTuple CacheBounded
