\* SPEC: PooledEvalContext.tla
\* Passes (gOuroboros 7cd17437) at the bounds where PoolByAddressBug fails: three
\* evaluations each, four EvalContexts, so a freed address is reused across tuples.
SPECIFICATION Spec
CONSTANTS
    Evaluators = {"e1", "e2"}
    Tuples = {"A", "B"}
    Rounds = 3
    Limit = 1
    MaxCtx = 4
    MaxM = 3
    Mutation = "None"
CHECK_DEADLOCK FALSE
INVARIANTS
    MachineExclusive NoCrossTupleMachine ContextMatchesTuple CacheBounded
