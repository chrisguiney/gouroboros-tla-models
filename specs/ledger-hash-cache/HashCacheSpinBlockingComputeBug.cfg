\* SPEC: HashCacheSpin.tla
\* Expected to FAIL (gOuroboros as written; documented, not a defect): a
\* compute that never returns makes every other caller spin forever:
\* WaitersReturn violated. No compute in gOuroboros can block.
SPECIFICATION FairSpec
CONSTANTS
    Callers = {"g1", "g2"}
    MaxCalls = 1
    MaxPanics = 0
    ComputeMode = "blocks"
    MaxSetCbor = 0
    SetCborMode = "contract"
    Mutation = "None"
INVARIANTS
    TypeOK
PROPERTY
    WaitersReturn
