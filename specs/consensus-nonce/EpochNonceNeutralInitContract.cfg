\* SPEC: EpochNonce.tla
\* NeutralNonce as the initial nonce, the caller keeping main's contract. The VRF input is left out (see EpochNonceVrfInputBug).
\* Expected: every listed invariant holds.
CONSTANTS
    SlotsPerEpoch = 3
    Window = 1
    MaxSlot = 8
    MaxBlocks = 5
    MaxRollback = 2
    Start = "Genesis"
    InitNonce = "Neutral"
    Era = "TPraos"
    EntropyEpochs = {2}
    Caller = "Contract"
    Operand = "Nonce"
    GoFix = {}
    GoBytes = "Family"
    GoApi = "Bytes"
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    StateAgrees EpochNonceAgrees CandidateFrozen EpochNonceDenotation
