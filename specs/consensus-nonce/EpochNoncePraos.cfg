\* SPEC: EpochNonce.tla
\* A Praos (Conway) chain with the wider window and no extra entropy, Dingo as the caller.
\* Expected: every invariant holds.
CONSTANTS
    SlotsPerEpoch = 3
    Window = 2
    MaxSlot = 8
    MaxBlocks = 5
    MaxRollback = 2
    Start = "Genesis"
    InitNonce = "GenesisHash"
    Era = "Praos"
    EntropyEpochs = {}
    Caller = "Dingo"
    Operand = "Nonce"
    GoFix = {}
    GoBytes = "Family"
    GoApi = "Bytes"
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    StateAgrees EpochNonceAgrees VrfInputAgrees CandidateFrozen EpochNonceDenotation
