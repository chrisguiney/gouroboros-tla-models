    SlotsPerEpoch = 3
    Window = 1
    MaxSlot = 11
    MaxBlocks = 5
    MaxRollback = 2
    Start = "Byron"
    InitNonce = "GenesisHash"
    Era = "TPraos"
    EntropyEpochs = {3}
    Caller = "Direct"
    Operand = "Raw"
    GoFix = {}
    GoBytes = "Family"
    GoApi = "Nonce"
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    StateAgrees EpochNonceAgrees VrfInputAgrees CandidateFrozen EpochNonceDenotation
