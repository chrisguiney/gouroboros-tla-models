\* SPEC: EpochNonce.tla
\* Byron-to-Shelley start (Shelley from epoch 1), TPraos, Dingo as the caller.
\* Expected: every invariant holds.
CONSTANTS
    SlotsPerEpoch = 3
    Window = 1
    MaxSlot = 11
    MaxBlocks = 5
    MaxRollback = 2
    Start = "Byron"
    InitNonce = "GenesisHash"
    Era = "TPraos"
    EntropyEpochs = {3}
    Caller = "Dingo"
    Operand = "Nonce"
    GoFix = {}
    GoBytes = "Family"
    GoApi = "Bytes"
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    StateAgrees EpochNonceAgrees VrfInputAgrees CandidateFrozen EpochNonceDenotation
