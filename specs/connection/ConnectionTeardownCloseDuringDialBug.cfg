\* SPEC: ConnectionTeardown.tla
\* gOuroboros 5c4f31c1: Close runs before the muxer exists; shutdown sees no
\* muxer, and setup then creates one that nothing stops.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = TRUE
    LateHandshakeError = FALSE
    CallbackCloseKinds = {}
    CloseCtxMayEnd = FALSE
    OwnerLateLoop = FALSE
    UserMarker = "none"
    Fix = {}

INVARIANT MuxerStoppedWhenClosed
