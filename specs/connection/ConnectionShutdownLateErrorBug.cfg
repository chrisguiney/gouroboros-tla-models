\* SPEC: ConnectionShutdown.tla
\* Intentionally fails: if a protocol could report an error after the
\* handshake finished, the protocol-error forwarder - started after
\* waitGroup.Wait may already have returned - could send on the closed
\* errorChan and panic. The shutdown order relies on that never happening.
SPECIFICATION Spec

CONSTANT LateProtocolErrors = TRUE

INVARIANT NoPanic
INVARIANT CloseWaitsForShutdown
