\* SPEC: ConnectionTeardown.tla
\* Without the join (fence and guard only), Close returns while a
\* mini-protocol callback still runs or a loop can still start one.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = FALSE
    LateHandshakeError = FALSE
    CallbackCloseKinds = {}
    UserMarker = "none"
    Fix = {"fence", "muxerGuard"}

INVARIANT NoCallbackAfterClose
