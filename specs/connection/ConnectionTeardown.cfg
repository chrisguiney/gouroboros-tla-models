\* SPEC: ConnectionTeardown.tla
\* gOuroboros 5c4f31c1 with Close only after Dial returns and no late
\* handshake error: no panic, Close waits for shutdown, no muxer left
\* running, no deadlock.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = FALSE
    LateHandshakeError = FALSE
    CallbackCloseKinds = {}
    UserMarker = "none"
    Fix = {}

INVARIANT NoPanic
INVARIANT CloseWaitsForShutdown
INVARIANT MuxerStoppedWhenClosed
