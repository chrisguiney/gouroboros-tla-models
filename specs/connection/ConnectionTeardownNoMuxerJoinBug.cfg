\* SPEC: ConnectionTeardown.tla
\* Without the muxer join, Close returns while the muxer goroutines, which
\* run the Metrics callbacks, still run.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = TRUE
    LateHandshakeError = FALSE
    CallbackCloseKinds = {"own"}
    CloseCtxMayEnd = FALSE
    OwnerLateLoop = FALSE
    MetricsStopKinds = {}
    UserMarker = "none"
    Fix = {"fence", "muxerGuard", "join", "closeEarly"}

INVARIANT MuxerJoinedAfterClose
