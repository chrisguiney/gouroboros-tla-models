\* SPEC: ConnectionTeardown.tla
\* Mutation: Muxer.Stop ignores the marker, so the callback that passes it
\* still waits for itself: deadlock.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = TRUE
    LateHandshakeError = FALSE
    CallbackCloseKinds = {"own"}
    CloseCtxMayEnd = TRUE
    OwnerLateLoop = FALSE
    MetricsStopKinds = {"own"}
    UserMarker = "none"
    Fix = {"fence", "muxerGuard", "join", "closeEarly", "muxerStop", "muxerStopNoMarker"}

INVARIANT NoPanic CloseWaitsForShutdown MuxerStoppedWhenClosed NoAddAfterWaitBegan NoCallbackAfterClose CloseTearsDown MuxerJoinedAfterClose NoMetricsCallbackAfterClose
