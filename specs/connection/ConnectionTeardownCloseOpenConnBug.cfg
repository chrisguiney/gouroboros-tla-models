\* SPEC: ConnectionTeardown.tla
\* gOuroboros f60a0213 under Close(ctx) and the muxer join: a Close made
\* after doneChan exists and before the muxer does returns while the conn
\* is still open; setup's guard closes it only when setup resumes.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = TRUE
    LateHandshakeError = FALSE
    CallbackCloseKinds = {"own"}
    CloseCtxMayEnd = TRUE
    OwnerLateLoop = TRUE
    MetricsStopKinds = {}
    MetricsCloseKinds = {}
    UserMarker = "none"
    Fix = {"fence", "muxerGuard", "join", "closeEarly", "muxerJoin"}

INVARIANT CloseClosesConn
