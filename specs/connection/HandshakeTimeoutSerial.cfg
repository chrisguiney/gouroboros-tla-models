\* SPEC: HandshakeTimeout.tla
\* gOuroboros 7cd17437 with no concurrent Close: the timer, error and finish cases tear down once, join the handshake loops, and start nothing after.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = FALSE
    HandshakeError = TRUE
    Fix = {}
    Mutation = {}

INVARIANT TypeOK
INVARIANT TornDownOnce
INVARIANT TimeoutTearsDown
INVARIANT NoProtocolStartAfterTeardown
INVARIANT NoRacyHandshakeWrite
INVARIANT NoHandshakeStartAfterTeardown
INVARIANT NoFinishedAfterFailedDial
