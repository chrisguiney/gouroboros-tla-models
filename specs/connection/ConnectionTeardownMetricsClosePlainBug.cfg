\* SPEC: ConnectionTeardown.tla
\* metricsClose with a Metrics callback that closes its connection with a
\* context without the muxer's marker: Close waits for the shutdown that
\* waits for it. Deadlock: the marker is required.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = TRUE
    LateHandshakeError = FALSE
    CallbackCloseKinds = {"own"}
    CloseCtxMayEnd = TRUE
    OwnerLateLoop = FALSE
    MetricsStopKinds = {"own"}
    MetricsCloseKinds = {"plain"}
    UserMarker = "none"
    Fix = {"fence", "muxerGuard", "join", "closeEarly", "muxerStop", "sockClose", "metricsClose"}

INVARIANT NoPanic CloseWaitsForShutdown MuxerStoppedWhenClosed NoAddAfterWaitBegan NoCallbackAfterClose CloseTearsDown MuxerJoinedAfterClose NoMetricsCallbackAfterClose CloseClosesConn
