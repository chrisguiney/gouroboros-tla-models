\* SPEC: MuxIngress.tla
\* Intentionally fails: with backpressure on, Bulk's reader waits for a Ping answer that sits behind Bulk segments the demuxer cannot place. Deadlock.
SPECIFICATION Spec

CONSTANTS
    LimitBulk = 2
    LimitPing = 1
    Budget = 3
    Backpressure = {"Bulk"}
    EmptyQueueAdmits = TRUE
    BulkWindow = 5
    Pings = 2
    Dependency = TRUE

INVARIANT NoOverflow
INVARIANT QueuesWithinLimits
