\* SPEC: ConnectionTeardown.tla
\* Mutation: CloseContext excuses a loop for any marker, not only one of
\* this connection's instances. Another connection's callback closing this
\* one then returns while this connection's callback still runs.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = FALSE
    LateHandshakeError = FALSE
    CallbackCloseKinds = {}
    UserMarker = "foreign"
    Fix = {"fence", "muxerGuard", "join", "closeEarly", "anyMarker"}

INVARIANT NoCallbackAfterClose
