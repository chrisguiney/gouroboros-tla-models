\* SPEC: ConnectionTeardown.tla
\* The adopted API, Close(ctx): every fix and the muxer join, a callback
\* closing with its own context while its instance starts one more loop,
\* and a user Close whose context may end: every invariant holds.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = TRUE
    LateHandshakeError = FALSE
    CallbackCloseKinds = {"own"}
    CloseCtxMayEnd = TRUE
    OwnerLateLoop = TRUE
    MetricsStopKinds = {}
    UserMarker = "none"
    Fix = {"fence", "muxerGuard", "join", "closeEarly", "muxerJoin", "sockClose"}

INVARIANT NoPanic
INVARIANT CloseWaitsForShutdown
INVARIANT MuxerStoppedWhenClosed
INVARIANT NoAddAfterWaitBegan
INVARIANT NoCallbackAfterClose
INVARIANT CloseTearsDown
INVARIANT MuxerJoinedAfterClose
INVARIANT CloseClosesConn
