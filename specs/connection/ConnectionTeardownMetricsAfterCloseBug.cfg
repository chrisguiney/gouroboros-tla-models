\* SPEC: ConnectionTeardown.tla
\* gOuroboros before the join: Muxer.Stop only signals and shutdown does not
\* wait for the muxer, so Close returns while a Metrics callback runs.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = TRUE
    LateHandshakeError = FALSE
    CallbackCloseKinds = {"own"}
    CloseCtxMayEnd = TRUE
    OwnerLateLoop = FALSE
    MetricsStopKinds = {"own"}
    MetricsCloseKinds = {}
    UserMarker = "none"
    Fix = {"fence", "muxerGuard", "join", "closeEarly"}

INVARIANT NoMetricsCallbackAfterClose
