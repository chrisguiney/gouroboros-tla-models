\* SPEC: ConnectionTeardown.tla
\* Why a callback closes with CloseContext: plain Close from a callback, with
\* the join, waits for shutdown, which waits for the callback: deadlock.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = FALSE
    LateHandshakeError = FALSE
    CallbackCloseKinds = {"plain"}
    CloseCtxMayEnd = FALSE
    OwnerLateLoop = FALSE
    MetricsStopKinds = {}
    UserMarker = "none"
    Fix = {"fence", "muxerGuard", "join"}

INVARIANT NoPanic
