\* SPEC: ConnectionTeardown.tla
\* A Metrics callback that stops its own muxer with a context without the
\* marker waits for the goroutine running it: deadlock. This is why the
\* marker exists.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = TRUE
    LateHandshakeError = FALSE
    CallbackCloseKinds = {"own"}
    CloseCtxMayEnd = TRUE
    OwnerLateLoop = FALSE
    MetricsStopKinds = {"plain"}
    UserMarker = "none"
    Fix = {"fence", "muxerGuard", "join", "closeEarly", "muxerStop"}

INVARIANT NoPanic CloseWaitsForShutdown MuxerStoppedWhenClosed NoAddAfterWaitBegan NoCallbackAfterClose CloseTearsDown MuxerJoinedAfterClose NoMetricsCallbackAfterClose
