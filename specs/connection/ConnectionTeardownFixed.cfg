\* SPEC: ConnectionTeardown.tla
\* Both fixes, with a concurrent Close and a late handshake error: every
\* invariant holds except NoCallbackAfterClose (not checked here).
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = TRUE
    LateHandshakeError = TRUE
    Fix = {"fence", "muxerGuard"}

INVARIANT NoPanic
INVARIANT CloseWaitsForShutdown
INVARIANT MuxerStoppedWhenClosed
INVARIANT NoAddAfterWaitBegan
