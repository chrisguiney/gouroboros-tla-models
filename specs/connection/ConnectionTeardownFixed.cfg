\* SPEC: ConnectionTeardown.tla
\* Every fix, with a concurrent Close (also before doneChan exists), a late
\* handshake error, a callback closing with its own context, and the user
\* closing with another connection's callback context: every invariant holds.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = TRUE
    LateHandshakeError = TRUE
    CallbackCloseKinds = {"own"}
    UserMarker = "foreign"
    Fix = {"fence", "muxerGuard", "join", "closeEarly"}

INVARIANT NoPanic
INVARIANT CloseWaitsForShutdown
INVARIANT MuxerStoppedWhenClosed
INVARIANT NoAddAfterWaitBegan
INVARIANT NoCallbackAfterClose
INVARIANT CloseTearsDown
