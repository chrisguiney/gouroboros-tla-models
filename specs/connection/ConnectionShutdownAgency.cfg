\* SPEC: ConnectionShutdownAgency.tla
\* The fixed classification, with pipelining: a close is clean only when the
\* peer owes nothing, and a close at rest is never an error.
SPECIFICATION Spec

CONSTANTS
    Protos = {"cs", "bf"}
    Depth = 2
    MaxRequests = 3
    Pipelining = TRUE
    Classifier = "fixed"

INVARIANT TypeOK
INVARIANT NoErrorOnlyWhenNobodyOwes NoErrorAtRest NoCleanWithUnansweredPipelined
