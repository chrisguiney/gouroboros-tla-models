\* SPEC: ConnectionTeardown.tla
\* Probe: the callback's instance can start a loop while the callback is
\* in Close.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = TRUE
    LateHandshakeError = FALSE
    CallbackCloseKinds = {"own"}
    CloseCtxMayEnd = FALSE
    OwnerLateLoop = TRUE
    MetricsStopKinds = {}
    MetricsCloseKinds = {}
    UserMarker = "none"
    Fix = {"fence", "muxerGuard", "join", "closeEarly", "muxerJoin"}

INVARIANT ProbeNoLateLoop
