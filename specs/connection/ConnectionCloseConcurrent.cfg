\* SPEC: ConnectionCloseConcurrent.tla
\* Any number of callbacks close the connection at once, and the user
\* closes it too: one teardown, every CloseContext returns, plain Close
\* waits for every loop, nothing hangs.
SPECIFICATION Spec

CONSTANTS
    Inst = {"a", "b", "c"}
    UserCloses = TRUE
    ForeignCloses = FALSE
    Fix = {"skipClosing"}

INVARIANT TypeOK
INVARIANT CloseWaitsForEveryLoop
INVARIANT CloseContextWaitsForOthers
