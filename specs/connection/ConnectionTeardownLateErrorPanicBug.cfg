\* SPEC: ConnectionTeardown.tla
\* gOuroboros 5c4f31c1, no concurrent Close: the finished handshake passes
\* SendError's check, shutdown stops it and closes errorChan, the error lands
\* in protoErrorChan, and the late protocol-error forwarder forwards it to the
\* closed errorChan: panic.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = FALSE
    LateHandshakeError = TRUE
    CallbackCloseKinds = {}
    UserMarker = "none"
    Fix = {}

INVARIANT NoPanic
