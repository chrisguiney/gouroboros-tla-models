\* SPEC: ConnectionTeardown.tla
\* Every fix, as Fixed, with the user calling plain Close: every invariant
\* holds.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = TRUE
    LateHandshakeError = TRUE
    CallbackCloseKinds = {"own"}
    CloseCtxMayEnd = FALSE
    OwnerLateLoop = FALSE
    MetricsStopKinds = {}
    MetricsCloseKinds = {}
    UserMarker = "none"
    Fix = {"fence", "muxerGuard", "join", "closeEarly", "sockClose"}

INVARIANT NoPanic
INVARIANT CloseWaitsForShutdown
INVARIANT MuxerStoppedWhenClosed
INVARIANT NoAddAfterWaitBegan
INVARIANT NoCallbackAfterClose
INVARIANT CloseTearsDown
