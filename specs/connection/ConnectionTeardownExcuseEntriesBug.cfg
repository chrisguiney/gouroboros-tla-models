\* SPEC: ConnectionTeardown.tla
\* Mutation: the callback's marker excuses only the loops running when its
\* Close began. A loop its instance starts later is waited for by shutdown,
\* and it waits for the callback, which waits for shutdown: deadlock.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = TRUE
    LateHandshakeError = FALSE
    CallbackCloseKinds = {"own"}
    CloseCtxMayEnd = FALSE
    OwnerLateLoop = TRUE
    UserMarker = "none"
    Fix = {"fence", "muxerGuard", "join", "closeEarly", "muxerJoin", "excuseEntries"}

INVARIANT NoPanic
