\* SPEC: ConnectionCloseConcurrent.tla
\* Callbacks close the connection, the user closes it, and a CloseContext
\* with another connection's context closes it too: that call, which
\* excused no loop, waits for every loop as Close does.
SPECIFICATION Spec

CONSTANTS
    Inst = {"a", "b", "c"}
    UserCloses = TRUE
    ForeignCloses = TRUE
    Fix = {"skipClosing", "foreignAsClose"}

INVARIANT TypeOK
INVARIANT CloseWaitsForEveryLoop
INVARIANT CloseContextWaitsForOthers
INVARIANT ForeignCloseWaitsForEveryLoop
