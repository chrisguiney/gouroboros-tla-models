\* SPEC: ConnectionTeardown.tla
\* A Metrics callback closes its connection with the muxer's CallbackContext,
\* and Close waits for connClosedChan: shutdown waits for the muxer's
\* goroutines, the callback's included, before it closes it. Deadlock.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = TRUE
    LateHandshakeError = FALSE
    CallbackCloseKinds = {"own"}
    CloseCtxMayEnd = TRUE
    OwnerLateLoop = FALSE
    MetricsStopKinds = {"own"}
    MetricsCloseKinds = {"own"}
    UserMarker = "none"
    Fix = {"fence", "muxerGuard", "join", "closeEarly", "muxerStop", "sockClose"}

INVARIANT NoPanic CloseWaitsForShutdown MuxerStoppedWhenClosed NoAddAfterWaitBegan NoCallbackAfterClose CloseTearsDown MuxerJoinedAfterClose NoMetricsCallbackAfterClose CloseClosesConn
