\* SPEC: ConnectionTeardown.tla
\* Without closeEarly: a Close before doneChan exists does nothing, and
\* Dial then sets up a live connection.
SPECIFICATION Spec

CONSTANTS
    ConcurrentClose = TRUE
    LateHandshakeError = FALSE
    CallbackCloseKinds = {}
    CloseCtxMayEnd = FALSE
    OwnerLateLoop = FALSE
    UserMarker = "none"
    Fix = {"fence", "muxerGuard", "join"}

INVARIANT CloseTearsDown
