\* SPEC: MuxIngress.tla
\* Intentionally fails: the same without the empty-queue rule. Bulk holds the budget, the Ping answer cannot get in, Bulk waits for it. Deadlock.
SPECIFICATION Spec

CONSTANTS
    LimitBulk = 2
    LimitPing = 1
    Budget = 2
    Backpressure = {"Bulk", "Ping"}
    EmptyQueueAdmits = FALSE
    BulkWindow = 4
    Pings = 2
    Dependency = TRUE

INVARIANT NoOverflow
INVARIANT QueuesWithinLimits
