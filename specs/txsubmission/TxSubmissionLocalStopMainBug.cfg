\* SPEC: TxSubmissionLocalStop.tla
\* Intentionally fails LocalStopBlamesNoPeer: Dingo main with gOuroboros main.
\* Node shutdown stops the mempool while the connection is open; the released
\* wait answers the blocking request with an empty list, which the client
\* refuses as a protocol violation.
SPECIFICATION Spec

CONSTANTS
    Callback = "waitCleanup"
    JoinsCallbacks = FALSE
    MaxTx = 1

INVARIANT TypeOK
INVARIANT LocalStopBlamesNoPeer
INVARIANT BlockingAnswerLegal
