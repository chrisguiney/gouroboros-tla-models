    MaxUnacked = 2
    MaxIds = 4
    MaxRequests = 5
    V16 = TRUE
    ClientClamps = TRUE
    Server = "reference"
    Client = "gouroboros"
    Mutation = "none"
INVARIANT ClientRefusesIllegal
INVARIANT ClientRefusesOnlyIllegal
INVARIANT ClampsOverWindow
INVARIANT ServerSendsLegal
INVARIANT ServerRefusesIllegal
INVARIANT ClientSendsLegal
INVARIANT BlockingRule
INVARIANT NonBlockingRule
INVARIANT WindowBound
INVARIANT ViewsAgree
INVARIANT HonestNeverRefused
