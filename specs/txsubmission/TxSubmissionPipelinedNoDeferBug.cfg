\* SPEC: TxSubmissionPipelined.tla
\* Mutation: the engine hands the Client a pipelined request before the
\* reply to the previous one was sent. Fails HonestNeverRefused
\* (alreadyPending).
SPECIFICATION Spec

CONSTANTS
    InWindow = 3
    OutWindow = 3
    MaxReq = 2
    MaxBatches = 2
    MaxIds = 5
    Version = "V2"
    Inbound = "reference"
    Mutation = {"noDefer"}

INVARIANT TypeOK
INVARIANT HonestNeverRefused
INVARIANT OutboundWithinWindow
INVARIANT InboundWithinWindow
INVARIANT ViewIsPrefix
INVARIANT AckedAtMostOnce
INVARIANT AckedOnlyAnnounced
INVARIANT NothingBehindBlocking
INVARIANT DoneOnlyWhenIdle
