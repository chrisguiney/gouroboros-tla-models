\* SPEC: TxSubmission.tla
\* EXPECTED TO FAIL: reachability probe. NodeToNodeV_16, the reference
\* server with a window one larger than the clamping gOuroboros client's:
\* a non-blocking request for at least one id is clamped to zero, which the
\* reference allows (an empty non-blocking reply).
SPECIFICATION Spec
CONSTANTS
    MaxUnacked = 2
    MaxIds = 4
    MaxRequests = 5
    V16 = TRUE
    ClientClamps = TRUE
    Server = "reference"
    Client = "gouroboros"
    Mutation = "none"
INVARIANT ProbeNoZeroClamp
