\* SPEC: TxSubmission.tla
\* EXPECTED TO FAIL: NodeToNodeV_16, the reference server against the
\* clamping gOuroboros client, which counts the ids left before the
\* acknowledgement and so refuses a blocking request that acknowledges the
\* whole window. Violates ClientRefusesOnlyIllegal, so TxSubmissionV16Clamp
\* covers the blocking request the client must serve.
SPECIFICATION Spec
CONSTANTS
    MaxUnacked = 2
    MaxIds = 4
    MaxRequests = 5
    V16 = TRUE
    ClientClamps = TRUE
    Server = "reference"
    Client = "gouroboros"
    Mutation = "refuseAckedBlocking"
INVARIANT ClientRefusesOnlyIllegal
