\* SPEC: TxSubmissionServerLocks.tla
\* Two restarts with no Stop: callers that retry after ErrStopServerProcess
\* land on the restarted instance.
SPECIFICATION Spec

CONSTANTS
    NCallers = 2
    MaxCalls = 3
    MaxDones = 2
    WithStop = FALSE
    ReadUnderState = FALSE
    StopGuard = TRUE
    Drain = TRUE

INVARIANT TypeOK
INVARIANT OnePending
INVARIANT ResultSlotNeverFull
INVARIANT NoInstallAfterStop
INVARIANT StopIsEffective
INVARIANT NoResultLost
INVARIANT LockOrderRespected
PROPERTY CallerAlwaysReleased
