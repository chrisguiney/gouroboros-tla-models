\* SPEC: TxSubmissionPipelined.tla
\* Mutation: the reference inbound acknowledges its whole ackable prefix
\* while pipelining. The outbound refuses (requestNonBlocking): fails
\* HonestNeverRefused, so the outbound's style check is exercised.
SPECIFICATION Spec

CONSTANTS
    InWindow = 3
    OutWindow = 3
    MaxReq = 2
    MaxBatches = 2
    MaxIds = 5
    Version = "V2"
    Inbound = "reference"
    Mutation = {"ackAll"}

INVARIANT TypeOK
INVARIANT HonestNeverRefused
INVARIANT OutboundWithinWindow
INVARIANT InboundWithinWindow
INVARIANT ViewIsPrefix
INVARIANT AckedAtMostOnce
INVARIANT AckedOnlyAnnounced
INVARIANT NothingBehindBlocking
INVARIANT DoneOnlyWhenIdle
