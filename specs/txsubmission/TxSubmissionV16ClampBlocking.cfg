\* SPEC: TxSubmission.tla
\* NodeToNodeV_16, a rogue server against the gOuroboros client that clamps
\* and refuses, before it clamps, a blocking request for no ids or one that
\* leaves ids unacknowledged: it never sends an empty reply to a blocking
\* request, and a blocking request it answers left nothing unacknowledged.
SPECIFICATION Spec
CONSTANTS
    MaxUnacked = 2
    MaxIds = 4
    MaxRequests = 5
    V16 = TRUE
    ClientClamps = TRUE
    Server = "rogue"
    Client = "gouroboros"
    Mutation = "none"
INVARIANT ClientSendsLegal
INVARIANT BlockingRule
INVARIANT ClampsOverWindow
INVARIANT WindowBound
