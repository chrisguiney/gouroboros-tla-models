    Txs = {"a", "b"}
    MaxIdx = 4
    MaxUnacked = 2
    Size <- ScaledSize
    MaxTx = 3
    RetainedLimit = 8
    DecodedLimit = 6
    Inbound = "reference"
    Fixed = FALSE

INVARIANT TypeOK
INVARIANT HonestNeverRefused
INVARIANT NoDuplicateWithinReply
INVARIANT ViewsAgree
INVARIANT WindowBound
