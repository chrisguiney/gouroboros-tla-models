\* SPEC: PeerSharing.tla
\* Honest but possibly slow servers: the client may time out in StBusy, but
\* nobody ever sees a protocol violation.
SPECIFICATION Spec

CONSTANTS
    Amounts = {0, 1, 2}
    ByteCap = 1
    Available = 2
    MaxRequests = 3
    MaxRuns = 2
    RogueMessages = 0
    UseTimeouts = TRUE
    SlowPeers = TRUE
    ClampToAmount = TRUE
    ClampToCap = TRUE
    ClientChecksCount = TRUE
    ServerRestarts = TRUE

INVARIANT TypeOK
INVARIANT NoViolations
INVARIANT RepliesWithinRequest
INVARIANT RepliesFit
INVARIANT NeverTakesTooMany
INVARIANT NeverBothHaveAgency

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
