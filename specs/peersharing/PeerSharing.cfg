\* SPEC: PeerSharing.tla
\* Two honest peers that answer in time; the client may end a run and start
\* another; the server restarts after MsgDone. Everything must hold.
SPECIFICATION Spec

CONSTANTS
    Amounts = {0, 1, 2}
    ByteCap = 1
    Available = 2
    MaxRequests = 3
    MaxRuns = 2
    RogueMessages = 0
    UseTimeouts = TRUE
    SlowPeers = FALSE
    ClampToAmount = TRUE
    ClampToCap = TRUE
    ClientChecksCount = TRUE
    ServerRestarts = TRUE

INVARIANT TypeOK
INVARIANT NoFailures
INVARIANT RepliesWithinRequest
INVARIANT RepliesFit
INVARIANT NeverTakesTooMany
INVARIANT OneMessageInFlightPerRun
INVARIANT NeverBothHaveAgency
INVARIANT ViewsAgreeWhenQuiet

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
