\* SPEC: PeerSharing.tla
\* Intentionally fails. The server sends every peer its source returns,
\* not cut to the amount asked for. The client rejects the reply.
SPECIFICATION Spec

CONSTANTS
    Amounts = {0, 1, 2}
    ByteCap = 1
    Available = 2
    MaxRequests = 3
    MaxRuns = 2
    RogueMessages = 0
    UseTimeouts = TRUE
    SlowPeers = FALSE
    ClampToAmount = FALSE
    ClampToCap = TRUE
    ClientChecksCount = TRUE
    ServerRestarts = TRUE

INVARIANT RepliesWithinRequest
INVARIANT NoFailures
