\* SPEC: PeerSharingExchange.tla
\* The fixed server gate: neither side of a connection that negotiated
\* NoPeerSharing requests or serves peers; no caller gets more than it asked
\* for; every GetPeers returns.
SPECIFICATION Spec

CONSTANTS
    Callers = {"c1", "c2"}
    Amounts = {1, 2}
    RogueRequests = 1
    ClientGate = TRUE
    ServerGate = "either"
    UseExchangeLock = TRUE

INVARIANT TypeOK
INVARIANT NeverRequestsWhenOff
INVARIANT NeverServesWhenOff
INVARIANT NeverGivenMoreThanAsked
PROPERTY EveryCallerReturns
