\* SPEC: PeerSharing.tla
\* Reachability probe: expected to be VIOLATED. Claims ProbeNeverIdleForever
\* holds with one rogue message: an honest client always ends with the
\* server in StDone, so only a stray request leaves the server idle for ever.
SPECIFICATION Spec

CONSTANTS
    Amounts = {0, 1, 2}
    ByteCap = 1
    Available = 2
    MaxRequests = 3
    MaxRuns = 2
    RogueMessages = 1
    UseTimeouts = TRUE
    SlowPeers = FALSE
    ClampToAmount = TRUE
    ClampToCap = TRUE
    ClientChecksCount = TRUE
    ServerRestarts = TRUE

INVARIANT ProbeNeverIdleForever
