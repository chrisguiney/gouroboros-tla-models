\* SPEC: PeerSharing.tla
\* Intentionally fails. The server cuts its list to the amount asked for but
\* not to what fits in 5760 bytes (MaxSharedPeers). A large request gets an
\* oversized reply.
SPECIFICATION Spec

CONSTANTS
    Amounts = {0, 1, 2}
    ByteCap = 1
    Available = 2
    MaxRequests = 3
    MaxRuns = 2
    RogueMessages = 0
    UseTimeouts = TRUE
    SlowPeers = FALSE
    ClampToAmount = TRUE
    ClampToCap = FALSE
    ClientChecksCount = TRUE
    ServerRestarts = TRUE

INVARIANT RepliesFit
INVARIANT NoFailures
