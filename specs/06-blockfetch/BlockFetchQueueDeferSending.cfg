\* SPEC: BlockFetchQueue.tla
\* The fix on gOuroboros fix/blockfetch-no-callback-for-unsent: a drain hands a request still sending to its caller, which resolves it only if its send succeeded.
SPECIFICATION Spec

CONSTANTS
    Callers = 3
    UseSendToken = TRUE
    DrainOnShutdown = TRUE
    DrainSkipsUnsent = FALSE
    DrainDefersSending = TRUE
    SenderResolvesDrained = TRUE
    NoBlocksRemovesHead = TRUE
    StartMarksStarted = TRUE

INVARIANT AnswersReachTheirRequest
INVARIANT HonestAnswersAccepted
INVARIANT ResolvedAtMostOnce
INVARIANT EveryReturnedIdResolved
INVARIANT NoCallbackForRefused
