\* SPEC: LocalStateQueryClientLimits.tla
\* Mutation: the result channels are not closed when the protocol stops.
\* Intentionally deadlocks: a call waits forever after an oversized result.
SPECIFICATION Spec

CONSTANTS
    MaxEra = 2
    MaxCalls = 4
    Timeouts = FALSE
    Oversize = TRUE
    InvalidateOnAcquired = TRUE
    InvalidateOnFailure = TRUE
    InvalidateOnRelease = TRUE
    DisarmOnTransition = TRUE
    CloseOnDone = FALSE

INVARIANT TypeOK
