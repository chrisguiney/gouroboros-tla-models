\* SPEC: LocalStateQueryClientLimits.tla
\* The opt-in timeouts tear the connection down when the node is slow,
\* which the specification never does. Intentionally fails NoFailures.
SPECIFICATION Spec

CONSTANTS
    MaxEra = 2
    MaxCalls = 4
    Timeouts = TRUE
    Oversize = FALSE
    InvalidateOnAcquired = TRUE
    InvalidateOnFailure = TRUE
    InvalidateOnRelease = TRUE
    DisarmOnTransition = TRUE
    CloseOnDone = TRUE

INVARIANT NoFailures
