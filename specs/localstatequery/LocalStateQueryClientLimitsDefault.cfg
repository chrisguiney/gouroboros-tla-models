\* SPEC: LocalStateQueryClientLimits.tla
\* gOuroboros at 7cd17437 with its defaults (no timeouts) and results that
\* fit. Passes, and the protocol never stops on an error.
SPECIFICATION Spec

CONSTANTS
    MaxEra = 2
    MaxCalls = 4
    Timeouts = FALSE
    Oversize = FALSE
    InvalidateOnAcquired = TRUE
    InvalidateOnFailure = TRUE
    InvalidateOnRelease = TRUE
    DisarmOnTransition = TRUE
    CloseOnDone = TRUE

INVARIANT TypeOK
INVARIANT CachedEraIsHeldEra
INVARIANT ErasReturnedFresh
INVARIANT NoStaleTimeout
INVARIANT NoFailures
