\* SPEC: LocalStateQueryClientLimits.tla
\* Probe: a cached era from a state older than the node's tip is reached
\* (legal: the client holds that older state). Intentionally fails.
SPECIFICATION Spec

CONSTANTS
    MaxEra = 2
    MaxCalls = 4
    Timeouts = TRUE
    Oversize = TRUE
    InvalidateOnAcquired = TRUE
    InvalidateOnFailure = TRUE
    InvalidateOnRelease = TRUE
    DisarmOnTransition = TRUE
    CloseOnDone = TRUE

INVARIANT ProbeNoCacheBehindChain
