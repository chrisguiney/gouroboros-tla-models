\* SPEC: LocalStateQueryClientLimits.tla
\* Probe: an oversized result stops the protocol while a call waits.
\* Intentionally fails.
SPECIFICATION Spec

CONSTANTS
    MaxEra = 2
    MaxCalls = 4
    Timeouts = TRUE
    Oversize = TRUE
    InvalidateOnAcquired = TRUE
    InvalidateOnFailure = TRUE
    InvalidateOnRelease = TRUE
    DisarmOnTransition = TRUE
    CloseOnDone = TRUE

INVARIANT ProbeNoOversizeWhileWaiting
