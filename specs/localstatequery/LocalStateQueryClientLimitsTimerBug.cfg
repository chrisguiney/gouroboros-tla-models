\* SPEC: LocalStateQueryClientLimits.tla
\* Mutation: entering StAcquired keeps the StAcquiring timer. Intentionally
\* fails NoStaleTimeout.
SPECIFICATION Spec

CONSTANTS
    MaxEra = 2
    MaxCalls = 4
    Timeouts = TRUE
    Oversize = TRUE
    InvalidateOnAcquired = TRUE
    InvalidateOnFailure = TRUE
    InvalidateOnRelease = TRUE
    DisarmOnTransition = FALSE
    CloseOnDone = TRUE

INVARIANT NoStaleTimeout
