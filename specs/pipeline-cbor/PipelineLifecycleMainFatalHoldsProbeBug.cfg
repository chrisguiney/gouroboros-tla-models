\* SPEC: PipelineLifecycle.tla
\* Fails (probe): after a fatal panic, with no Stop and no parent cancel, the
\* pipeline keeps the items it held until Stop, as documented.
SPECIFICATION Spec
CONSTANTS
    N = 2
    Cap = 1
    Budget = 2
    MaxPending = 1
    ApplyMode = "returns"
    Reader = TRUE
    OwnerStop = FALSE
    SecondStop = FALSE
    ParentCancel = FALSE
    Drainer = TRUE
    PR3161 = TRUE
    CallbackMarker = TRUE
    NewStop = TRUE
    StopTimeout = FALSE
    CancelCleanup = TRUE
    StagePanic = "decode"
    Mutation = "None"
INVARIANTS
    ProbeNothingHeldWhenStuck
