\* SPEC: BlockPipeline.tla
\* Passes (fix): WithHeaderOnly or WithTrustedDecodeOnly without WithLosslessResults; a slow reader still receives every committed block before Stop.
SPECIFICATION Spec
CONSTANTS
    N = 4
    MaxPending = 2
    CapacityBound = 2
    QueueCap = 1
    Consumer = TRUE
    CanFail = TRUE
    StopAllowed = TRUE
    DrainWaitsForApply = TRUE
    FailStops = TRUE
    ResultsNonBlocking = TRUE
    LosslessResults = FALSE
    HasApplyFunc = FALSE
    DecodeOnlyLossless = TRUE
INVARIANTS
    TypeOK AppliedInOrderOnce CompletedMeansApplied NoApplyAfterFailure PendingBounded NoCommitAfterRollback ReadInCommitOrder ReadLosslessWithoutDrops LosslessNeverDropsBeforeStop DecodeOnlyNeverDropsBeforeStop
