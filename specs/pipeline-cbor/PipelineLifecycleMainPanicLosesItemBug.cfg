\* SPEC: PipelineLifecycle.tla
\* Fails (mutation): the panicking worker dies holding its item, so the
\* runner waits for it forever and the drainer never returns: deadlock.
SPECIFICATION Spec
CONSTANTS
    N = 3
    Cap = 1
    Budget = 3
    MaxPending = 1
    ApplyMode = "returns"
    Reader = TRUE
    OwnerStop = FALSE
    SecondStop = FALSE
    ParentCancel = FALSE
    Drainer = TRUE
    PR3161 = TRUE
    CallbackMarker = TRUE
    NewStop = TRUE
    StopTimeout = FALSE
    CancelCleanup = TRUE
    StagePanic = "decode"
    Mutation = "PanicLosesItem"
INVARIANTS
    TypeOK NoPanic BudgetMatchesActive AllReleasedAfterStop JoinedAfterStop NoLeakWhenQuiescent StopPublished AppliedInOrderOnce NoApplyAfterPanic PanicFailsDrain NoCommitAfterDrain
