\* SPEC: PipelineLifecycle.tla
\* Fails (PR #3233 on main without the callback marker): ApplyFunc's
\* Stop waits for the runner that is running it, which never exits, so
\* the forwarder and the stranded items are never released.
SPECIFICATION Spec
CONSTANTS
    N = 2
    Cap = 1
    Budget = 2
    MaxPending = 1
    ApplyMode = "callsStop"
    Reader = TRUE
    OwnerStop = TRUE
    SecondStop = FALSE
    ParentCancel = TRUE
    Drainer = FALSE
    PR3161 = TRUE
    CallbackMarker = FALSE
    NewStop = TRUE
    StopTimeout = FALSE
    CancelCleanup = TRUE
    StagePanic = "none"
    Mutation = "None"
INVARIANTS
    TypeOK NoPanic BudgetMatchesActive AllReleasedAfterStop JoinedAfterStop MuNotHeldAcrossApply NoLeakWhenQuiescent
