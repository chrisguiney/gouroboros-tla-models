\* SPEC: PipelineLifecycle.tla
\* Fails (mutation): the runner treats an ApplyFunc panic as an ordinary
\* error and commits the next block: NoApplyAfterPanic.
SPECIFICATION Spec
CONSTANTS
    N = 2
    Cap = 1
    Budget = 2
    MaxPending = 1
    ApplyMode = "returns"
    Reader = TRUE
    OwnerStop = TRUE
    SecondStop = FALSE
    ParentCancel = TRUE
    Drainer = TRUE
    PR3161 = TRUE
    CallbackMarker = TRUE
    NewStop = TRUE
    StopTimeout = FALSE
    CancelCleanup = TRUE
    StagePanic = "apply"
    Mutation = "PanicNotFatal"
INVARIANTS
    NoApplyAfterPanic
