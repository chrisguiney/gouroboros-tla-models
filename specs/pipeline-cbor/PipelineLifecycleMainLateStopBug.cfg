\* SPEC: PipelineLifecycle.tla
\* EXPECTED TO FAIL (StopPublished). A Stop after the parent-cancel
\* watcher has started the teardown returns without publishing stopping,
\* so Start and WaitForDrain do not see that Stop has begun.
SPECIFICATION Spec
CONSTANTS
    N = 2
    Cap = 1
    Budget = 2
    MaxPending = 1
    ApplyMode = "returns"
    Reader = TRUE
    OwnerStop = TRUE
    SecondStop = FALSE
    ParentCancel = TRUE
    Drainer = FALSE
    PR3161 = TRUE
    CallbackMarker = TRUE
    NewStop = TRUE
    StopTimeout = FALSE
    CancelCleanup = TRUE
    Mutation = "LateStopUnpublished"
INVARIANTS
    TypeOK StopPublished
