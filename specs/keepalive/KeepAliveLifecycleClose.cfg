\* SPEC: KeepAliveLifecycle.tla
\* Connection shutdown racing a restart, with the fix for issue 3085:
\* shutdown calls Server.Stop, so no restart starts a new instance after it.
SPECIFICATION Spec

CONSTANTS
    MaxDones = 2
    Stopper = "Connection"
    StopGuard = TRUE
    CancelUnregisters = TRUE
    ShutdownStopsServer = TRUE
    Reader = "none"

INVARIANT TypeOK
INVARIANT AtMostOneRunning
INVARIANT NoStartAfterClose
