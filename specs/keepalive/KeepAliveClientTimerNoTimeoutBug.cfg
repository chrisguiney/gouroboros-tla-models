\* SPEC: KeepAliveClientTimer.tla
\* gOuroboros 7cd17437: a zero Timeout arms no timer for the answer, so a silent server is never noticed and pings stop.
SPECIFICATION Spec

CONSTANTS
    Period = 2
    Timeout = 0
    DefaultPeriod = 2
    DefaultTimeout = 1
    PeerLimit = 3
    MaxTime = 8
    PeerKinds = {"silent"}
    StopKind = "client"
    Fix = {}
    Mutation = {}

INVARIANT TypeOK
INVARIANT AtMostOneInFlight
INVARIANT FiresBounded
INVARIANT PeerNeverTimesOut
INVARIANT SilentPeerNoticed
INVARIANT StopLeavesNoTimer
INVARIANT NoSendAfterStop
INVARIANT ExtraFiresAfterStopAtMostOne
INVARIANT NoTimerWhenQuiescent
