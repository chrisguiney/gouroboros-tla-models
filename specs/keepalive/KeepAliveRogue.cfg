\* SPEC: KeepAlive.tla
\* A peer may inject up to two arbitrary messages at any moment. The honest
\* side must still only move along legal transitions, never get stuck
\* forever (TLC checks for deadlock by default), and end up done or hung up.
SPECIFICATION Spec

CONSTANTS
    MaxPings = 2
    MaxRuns = 2
    RogueMessages = 2
    UseTimeouts = TRUE
    SlowPeers = FALSE
    ServerRestarts = TRUE

INVARIANT TypeOK

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
