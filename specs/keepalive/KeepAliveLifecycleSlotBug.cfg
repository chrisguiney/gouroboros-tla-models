\* SPEC: KeepAliveLifecycle.tla
\* The Stop guard as first written: a restart cancelled by Stop leaves the
\* muxer slot StopForRestart suspended, still buffering the client's bytes.
SPECIFICATION Spec

CONSTANTS
    MaxDones = 2
    Stopper = "Server"
    StopGuard = TRUE
    CancelUnregisters = FALSE
    ShutdownStopsServer = TRUE
    Reader = "none"

INVARIANT TypeOK
INVARIANT AtMostOneRunning
INVARIANT StopIsEffective
INVARIANT StopReleasesSlot
