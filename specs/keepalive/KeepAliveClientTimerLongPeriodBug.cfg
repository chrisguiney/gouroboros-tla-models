\* SPEC: KeepAliveClientTimer.tla
\* A Period not below the server's 97 s limit: an honest server hangs up between pings. gOuroboros accepts it.
SPECIFICATION Spec

CONSTANTS
    Period = 3
    Timeout = 1
    DefaultPeriod = 2
    DefaultTimeout = 1
    PeerLimit = 3
    MaxTime = 8
    PeerKinds = {"honest"}
    StopKind = "client"
    Fix = {}
    Mutation = {}

INVARIANT TypeOK
INVARIANT AtMostOneInFlight
INVARIANT FiresBounded
INVARIANT PeerNeverTimesOut
INVARIANT SilentPeerNoticed
INVARIANT StopLeavesNoTimer
INVARIANT NoSendAfterStop
INVARIANT ExtraFiresAfterStopAtMostOne
INVARIANT NoTimerWhenQuiescent
