\* SPEC: KeepAliveClientTimer.tla
\* Mutation: no inFlight guard; a second ping goes out before the first is answered.
SPECIFICATION Spec

CONSTANTS
    Period = 2
    Timeout = 3
    DefaultPeriod = 2
    DefaultTimeout = 3
    PeerLimit = 3
    MaxTime = 8
    PeerKinds = {"honest"}
    StopKind = "client"
    Fix = {}
    Mutation = {"noInFlightGuard"}

INVARIANT TypeOK
INVARIANT AtMostOneInFlight
INVARIANT FiresBounded
INVARIANT PeerNeverTimesOut
INVARIANT SilentPeerNoticed
INVARIANT StopLeavesNoTimer
INVARIANT NoSendAfterStop
INVARIANT ExtraFiresAfterStopAtMostOne
INVARIANT NoTimerWhenQuiescent
