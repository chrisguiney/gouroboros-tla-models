\* SPEC: KeepAliveClientTimer.tla
\* gOuroboros 7cd17437: a zero Period (a Config literal without it) re-arms the timer at the same instant, forever.
SPECIFICATION Spec

CONSTANTS
    Period = 0
    Timeout = 1
    DefaultPeriod = 2
    DefaultTimeout = 1
    PeerLimit = 3
    MaxTime = 8
    PeerKinds = {"honest", "rogue", "silent"}
    StopKind = "client"
    Fix = {}
    Mutation = {}

INVARIANT TypeOK
INVARIANT AtMostOneInFlight
INVARIANT FiresBounded
INVARIANT PeerNeverTimesOut
INVARIANT SilentPeerNoticed
INVARIANT StopLeavesNoTimer
INVARIANT NoSendAfterStop
INVARIANT ExtraFiresAfterStopAtMostOne
INVARIANT NoTimerWhenQuiescent
