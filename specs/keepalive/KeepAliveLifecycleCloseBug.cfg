\* SPEC: KeepAliveLifecycle.tla
\* Intentionally fails: gOuroboros before the fix for issue 3085. Connection
\* shutdown stopped only the instance it read, so a restart could start a
\* new instance after the muxer stopped.
SPECIFICATION Spec

CONSTANTS
    MaxDones = 2
    Stopper = "Connection"
    StopGuard = TRUE
    CancelUnregisters = TRUE
    ShutdownStopsServer = FALSE
    Reader = "none"

INVARIANT TypeOK
INVARIANT AtMostOneRunning
INVARIANT NoStartAfterClose
