\* SPEC: LocalStateQueryClient.tla
\* gOuroboros with the fix on fix/localstatequery-implicit-acquire and Release refusing when nothing is acquired: a call whose query acquired implicitly releases as it returns. Query2 is a call that makes two queries.
SPECIFICATION Spec

CONSTANTS
    Callers = {"c1", "c2"}
    OpsPerCaller = 2
    Ops = {"AcqPoint", "AcqVolatile", "AcqImmutable", "Release", "Query", "Query2"}
    MaxTip = 1
    MayStop = TRUE
    OldVersion = FALSE
    GateImmutable = FALSE
    ReleaseChecksAcquired = TRUE
    ReleaseImplicit = TRUE
    ReleasePerQuery = FALSE
    NoMutex = FALSE
    KeepAcquiredOnFailure = FALSE

INVARIANT OwnAnswer NoViolation FlagMatchesState
INVARIANT FreshImplicitSnapshot OneSnapshotPerCall
