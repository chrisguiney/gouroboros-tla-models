\* SPEC: StateLimits.tla
\* Passes with the fix: the Server times its V2 blocking, non-blocking and message waits with the caller options.
SPECIFICATION Spec

CONSTANTS
    Side = "MsgSubV2Server"
    Fixes = {"ServerOptions", "NonBlockingTimed", "V1BlockingUntimed"}
    OptionValue = 1
    Msgs = 3
    TimerArm = "afterHandler"
    OverLimit = "refuse"
    TimeoutDeviations = {}
    LimitDeviations = {}

INVARIANT OnlyThePeerIsTimed
INVARIANT OptionsTakeEffect
