\* SPEC: StateLimits.tla
\* Passes with the fix: the V1 Server times non-blocking and message waits with the options; a V1 blocking request stays untimed.
SPECIFICATION Spec

CONSTANTS
    Side = "MsgSubV1Server"
    Fixes = {"ServerOptions", "NonBlockingTimed", "V1BlockingUntimed"}
    OptionValue = 1
    Msgs = 3
    TimerArm = "afterHandler"
    OverLimit = "refuse"
    TimeoutDeviations = {}
    LimitDeviations = {}

INVARIANT OnlyThePeerIsTimed
INVARIANT OptionsTakeEffect
INVARIANT WaitIsBounded
