\* SPEC: EnginePipelining.tla
\* Intentionally fails: without reply reservations, a reply that arrives before
\* its pipelined request's deferred state change is refused.
SPECIFICATION Spec

CONSTANTS
    Proto = "BlockFetch"
    MaxRequests = 2
    MaxBlocks = 1
    MaxBatch = 2
    ReplyReservation = FALSE

INVARIANT NothingFails
INVARIANT FinalOnlyWhenNothingOutstanding
INVARIANT ViewsAgreeWhenQuiet
