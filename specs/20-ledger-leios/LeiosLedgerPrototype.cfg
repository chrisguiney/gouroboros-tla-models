\* SPEC: LeiosLedger.tla
\* The reference without the same-epoch rule, as the prototype node runs it.
\* Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Txs = {"t1", "t2"}
    EbChoices <- DefaultEbs
    MaxSlot = 5
    CertDelay = 2
    EpochLength = 4
    MaxChain = 3
    RefSameEpoch = FALSE
    Impl = "ref"
    GoCallerAppliesEb = TRUE
    Mutation = "none"
INVARIANTS
    TypeOK
    LedgerMatchesChain
    CertifiedChainWellFormed
    NoTxTwice
    EbAppliedAtMostOnce
