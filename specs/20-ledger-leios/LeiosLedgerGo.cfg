\* SPEC: LeiosLedger.tla
\* gOuroboros decides, with a caller that applies each certified EB first,
\* against the prototype (no same-epoch rule). Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Txs = {"t1", "t2"}
    EbChoices <- DefaultEbs
    MaxSlot = 5
    CertDelay = 2
    EpochLength = 4
    MaxChain = 3
    RefSameEpoch = FALSE
    Impl = "go"
    GoCallerAppliesEb = TRUE
    Mutation = "none"
INVARIANTS
    TypeOK
    LedgerMatchesChain
    CertifiedChainWellFormed
    NoTxTwice
    EbAppliedAtMostOnce
    GoAgrees
