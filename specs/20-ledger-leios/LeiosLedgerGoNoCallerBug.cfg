\* SPEC: LeiosLedger.tla
\* EXPECTED TO FAIL: gOuroboros decides and the caller never applies the EB.
\* A CertRB is accepted without its EB: LedgerMatchesChain fails.
SPECIFICATION Spec
CONSTANTS
    Txs = {"t1", "t2"}
    EbChoices <- DefaultEbs
    MaxSlot = 5
    CertDelay = 2
    EpochLength = 4
    MaxChain = 3
    RefSameEpoch = FALSE
    Impl = "go"
    GoCallerAppliesEb = FALSE
    Mutation = "none"
INVARIANTS
    LedgerMatchesChain
