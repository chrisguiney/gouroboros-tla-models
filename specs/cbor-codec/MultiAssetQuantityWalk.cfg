\* [G5]: every quantity read pair by pair from the wire. Every field,
\* value and encoding, duplicates included. Expected: passes.
CONSTANTS
    Versions = {8, 9, 12}
    Fields = {"outputAsset", "mintAsset", "coinBare", "coinInPair"}
    TryValues = {"zero", "five", "w64max", "i64maxPlus1", "minusOne", "i64min", "i64minMinus1", "beyond64"}
    Encodings = {"head", "bignum", "bignumLongTag", "bignumBehindDup"}
    GoRule = "fixWalk"
SPECIFICATION Spec
INVARIANTS
    QuantityAsDecodeWord64
