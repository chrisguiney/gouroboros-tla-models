\* Two honest peers; the client may end a run and start another on the same
\* connection, and the server restarts as the reference implementation does.
\* Everything should work, every time.
SPECIFICATION Spec

CONSTANTS
    MaxPings = 3
    MaxRuns = 2
    RogueMessages = 0
    UseTimeouts = TRUE
    ServerRestarts = TRUE

INVARIANT TypeOK
INVARIANT NoFailures
INVARIANT OneMessageInFlightPerRun
INVARIANT NeverBothHaveAgency
INVARIANT ViewsAgreeWhenQuiet

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
