\* SPEC: KeepAlive.tla
\* THE BUG THIS MODEL FOUND. Same honest peers as KeepAlive.cfg, but the
\* server does not restart after MsgDone, as gOuroboros's keep-alive server
\* does not. A client that starts a second run on the connection is never
\* answered, and times out. Fails until gOuroboros restarts the server.
SPECIFICATION Spec

CONSTANTS
    MaxPings = 3
    MaxRuns = 2
    RogueMessages = 0
    UseTimeouts = TRUE
    SlowPeers = FALSE
    ServerRestarts = FALSE

INVARIANT NoFailures
