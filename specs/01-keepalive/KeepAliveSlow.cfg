\* SPEC: KeepAlive.tla
\* Honest peers that may be slower than the timeouts allow [S2]. A timeout
\* may then end the connection, but a slow peer must never cause a protocol
\* violation, and every move must still be legal.
SPECIFICATION Spec

CONSTANTS
    MaxPings = 3
    MaxRuns = 2
    RogueMessages = 0
    UseTimeouts = TRUE
    SlowPeers = TRUE
    ServerRestarts = TRUE

INVARIANT TypeOK
INVARIANT NoViolations
INVARIANT ResponsesEchoCookies

PROPERTY OnlyLegalMoves
PROPERTY FailuresAreFinal
