\* SPEC: KeepAlive.tla
\* Intentionally fails: without timeouts, one rogue message can leave a side
\* waiting forever. TLC reports this as a deadlock. It is why gOuroboros
\* arms ClientTimeout and ServerTimeout in the keep-alive StateMap.
SPECIFICATION Spec

CONSTANTS
    MaxPings = 2
    RogueMessages = 1
    UseTimeouts = FALSE

INVARIANT TypeOK
