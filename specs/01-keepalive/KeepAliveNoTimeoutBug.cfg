\* SPEC: KeepAlive.tla
\* Intentionally fails: without timeouts, one rogue message can leave a side
\* waiting forever. TLC reports a deadlock: after the client has finished for
\* good, a rogue MsgKeepAlive restarts the server, which then waits for a
\* client that will never speak again. This is why the specification sets a
\* timeout on every state where a side waits for its peer.
SPECIFICATION Spec

CONSTANTS
    MaxPings = 2
    MaxRuns = 2
    RogueMessages = 1
    UseTimeouts = FALSE
    ServerRestarts = TRUE

INVARIANT TypeOK
