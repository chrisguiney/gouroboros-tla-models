\* SPEC: LocalTxSubmission.tla
\* gOuroboros's client as it is (busyMutex, the StBusy timer) against a
\* server that never has to wait for room, and one run, since the gOuroboros
\* server does not restart. Passes: the timer only matters when the server
\* waits.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 1
    MaxSubmits = 3
    MaxFlips = 0
    RogueMessages = 0
    ClientTimeouts = TRUE
    SerialCalls = TRUE
    ServerRestarts = FALSE
    PrintTable = FALSE

INVARIANT TypeOK
INVARIANT NoFailures
INVARIANT AnswersReachTheirCallers
INVARIANT NeverBothHaveAgency
INVARIANT OneSubmitInFlight

PROPERTY FailuresAreFinal
