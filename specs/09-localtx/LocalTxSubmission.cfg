    MaxRuns = 2
    MaxSubmits = 2
    MaxFlips = 2
    RogueMessages = 0
    ClientTimeouts = FALSE
    SerialCalls = TRUE
    ServerRestarts = TRUE
    PrintTable = FALSE

INVARIANT TypeOK
