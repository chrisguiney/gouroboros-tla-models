\* SPEC: LocalTxMonitor.tla
\* MUTATION: as LocalTxMonitorOldNode.cfg, but the client sends
\* MsgGetMeasures whatever version was agreed. Intentionally fails:
\* NoFailures is violated, because the older node cannot decode it and
\* tears the connection down. This is why the client checks the version.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 1
    MaxQueries = 2
    MaxChanges = 1
    RogueMessages = 0
    BusyKinds = TRUE
    AwaitWaitsForChange = TRUE
    ClientTimeouts = FALSE
    StopReleases = TRUE
    ClientSendsMeasures = TRUE
    ServerKnowsMeasures = FALSE
    ServerRestarts = TRUE
    ClientChecksVersion = FALSE
    NegotiatedV20 = FALSE
    PrintTable = FALSE

INVARIANT TypeOK
INVARIANT NoFailures
