\* The reference: a reference client and the node's server, as the
\* specification and the reference implementation describe them. Two runs,
\* two queries, two mempool changes. Everything should work, every time.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 2
    MaxQueries = 2
    MaxChanges = 2
    RogueMessages = 0
    BusyKinds = TRUE
    AwaitWaitsForChange = TRUE
    ClientTimeouts = FALSE
    StopReleases = TRUE
    ClientSendsMeasures = TRUE
    ServerKnowsMeasures = TRUE
    ServerRestarts = TRUE
    PrintTable = FALSE

INVARIANT TypeOK
INVARIANT NoFailures
INVARIANT RepliesMatchQueries
INVARIANT AwaitGetsNewSnapshot
INVARIANT NeverBothHaveAgency
INVARIANT BusyViewsAgree

PROPERTY FailuresAreFinal
