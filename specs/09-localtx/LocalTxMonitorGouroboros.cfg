\* SPEC: LocalTxMonitor.tla
\* gOuroboros client against gOuroboros server, with the Stop fix
\* (StopReleases). The server answers MsgAwaitAcquire at once, so the
\* client timers never fire; neither side knows MsgGetMeasures; one run,
\* because the gOuroboros server does not restart.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 1
    MaxQueries = 3
    MaxChanges = 2
    RogueMessages = 0
    BusyKinds = TRUE
    AwaitWaitsForChange = FALSE
    ClientTimeouts = TRUE
    StopReleases = TRUE
    StopCancelsWait = TRUE
    ClientSendsMeasures = FALSE
    ServerKnowsMeasures = FALSE
    ServerRestarts = FALSE
    ClientChecksVersion = TRUE
    NegotiatedV20 = TRUE
    PrintTable = FALSE

INVARIANT TypeOK
INVARIANT NoFailures
INVARIANT RepliesMatchQueries
INVARIANT NeverBothHaveAgency
INVARIANT BusyViewsAgree
INVARIANT NewRunServed
INVARIANT StopNeverWaitsOnPeer

PROPERTY FailuresAreFinal
