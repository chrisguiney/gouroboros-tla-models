\* SPEC: LocalTxSubmission.tla
\* THE BUG (gOuroboros client against the node). Intentionally fails. The
\* node holds MsgSubmitTx until its mempool has room; the client's StBusy
\* timer (30 s by default) tears the connection down first.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 1
    MaxSubmits = 1
    MaxFlips = 1
    RogueMessages = 0
    ClientTimeouts = TRUE
    SerialCalls = TRUE
    StopCancelsWait = TRUE
    ServerRestarts = FALSE
    PrintTable = FALSE

INVARIANT NoFailures
