\* SPEC: LocalTxMonitor.tla
\* A rogue server may inject one arbitrary message. The connection may be
\* torn down, but the client must never hand a caller the wrong reply.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 1
    MaxQueries = 2
    MaxChanges = 1
    RogueMessages = 1
    BusyKinds = TRUE
    AwaitWaitsForChange = TRUE
    ClientTimeouts = FALSE
    StopReleases = TRUE
    ClientSendsMeasures = TRUE
    ServerKnowsMeasures = TRUE
    ServerRestarts = TRUE
    PrintTable = FALSE

INVARIANT TypeOK
INVARIANT RepliesMatchQueries

PROPERTY FailuresAreFinal

\* A rogue message can leave the connection stuck (for example, an
\* MsgAcquire to a server whose client is done). These configs check safety
\* only.
CHECK_DEADLOCK FALSE
