\* SPEC: LocalTxMonitor.tla
\* A DEVIATION (reference client against the gOuroboros server).
\* Intentionally fails. The node always understands MsgGetMeasures; the
\* gOuroboros server cannot decode it and tears the connection down.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 1
    MaxQueries = 1
    MaxChanges = 0
    RogueMessages = 0
    BusyKinds = TRUE
    AwaitWaitsForChange = TRUE
    ClientTimeouts = FALSE
    StopReleases = TRUE
    ClientSendsMeasures = TRUE
    ServerKnowsMeasures = FALSE
    ServerRestarts = TRUE
    ClientChecksVersion = TRUE
    NegotiatedV20 = TRUE
    PrintTable = FALSE

INVARIANT NoFailures
