\* SPEC: LocalTxMonitor.tla
\* The fixed gOuroboros client against a node that agreed a version before
\* NodeToClientV_20 and so cannot decode MsgGetMeasures [R6]. The client
\* checks the version and never sends it, so the connection stays up.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 1
    MaxQueries = 2
    MaxChanges = 1
    RogueMessages = 0
    BusyKinds = TRUE
    AwaitWaitsForChange = TRUE
    ClientTimeouts = FALSE
    StopReleases = TRUE
    StopCancelsWait = TRUE
    ClientSendsMeasures = TRUE
    ServerKnowsMeasures = FALSE
    ServerRestarts = TRUE
    ClientChecksVersion = TRUE
    NegotiatedV20 = FALSE
    PrintTable = FALSE

INVARIANT TypeOK
INVARIANT NoFailures
INVARIANT RepliesMatchQueries
INVARIANT NewRunServed

PROPERTY FailuresAreFinal
