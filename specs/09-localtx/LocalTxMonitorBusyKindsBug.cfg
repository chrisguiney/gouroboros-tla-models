\* SPEC: LocalTxMonitor.tla
\* MUTATION: one Busy state that takes any reply (gOuroboros before
\* matchReply). Intentionally fails: a rogue reply of the wrong kind is
\* handed to the caller as the answer to its query.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 1
    MaxQueries = 2
    MaxChanges = 0
    RogueMessages = 1
    BusyKinds = FALSE
    AwaitWaitsForChange = TRUE
    ClientTimeouts = FALSE
    StopReleases = TRUE
    StopCancelsWait = TRUE
    ClientSendsMeasures = TRUE
    ServerKnowsMeasures = TRUE
    ServerRestarts = TRUE
    ClientChecksVersion = TRUE
    NegotiatedV20 = TRUE
    PrintTable = FALSE

INVARIANT RepliesMatchQueries

\* A rogue message can leave the connection stuck (for example, an
\* MsgAcquire to a server whose client is done). These configs check safety
\* only.
CHECK_DEADLOCK FALSE
