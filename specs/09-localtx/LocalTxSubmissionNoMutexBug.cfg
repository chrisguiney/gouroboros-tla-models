\* SPEC: LocalTxSubmission.tla
\* MUTATION: SubmitTx without busyMutex. Intentionally fails: two callers
\* wait on the same result channel, and the first answer can wake the
\* caller whose transaction is still queued.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 1
    MaxSubmits = 2
    MaxFlips = 0
    RogueMessages = 0
    ClientTimeouts = FALSE
    SerialCalls = FALSE
    ServerRestarts = FALSE
    PrintTable = FALSE

INVARIANT AnswersReachTheirCallers
