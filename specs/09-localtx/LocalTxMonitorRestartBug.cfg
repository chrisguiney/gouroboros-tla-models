\* SPEC: LocalTxMonitor.tla
\* A DEVIATION (gOuroboros server on main). Intentionally fails:
\* NewRunServed is violated. The server does not restart after MsgDone, so
\* the MsgAcquire that starts the client's second run waits on a server
\* whose run is over, and is never read.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 2
    MaxQueries = 0
    MaxChanges = 0
    RogueMessages = 0
    BusyKinds = TRUE
    AwaitWaitsForChange = TRUE
    ClientTimeouts = FALSE
    StopReleases = TRUE
    ClientSendsMeasures = FALSE
    ServerKnowsMeasures = FALSE
    ServerRestarts = FALSE
    ClientChecksVersion = TRUE
    NegotiatedV20 = TRUE
    PrintTable = FALSE

INVARIANT TypeOK
INVARIANT NewRunServed
