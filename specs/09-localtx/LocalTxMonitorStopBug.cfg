\* SPEC: LocalTxMonitor.tla
\* THE BUG (gOuroboros client, any server). Intentionally fails. Stop()
\* sends MsgDone even when a query call left the snapshot acquired; MsgDone
\* is not legal in StAcquired, so the client's own send loop refuses it and
\* tears the connection down.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 1
    MaxQueries = 1
    MaxChanges = 0
    RogueMessages = 0
    BusyKinds = TRUE
    AwaitWaitsForChange = FALSE
    ClientTimeouts = FALSE
    StopReleases = FALSE
    ClientSendsMeasures = FALSE
    ServerKnowsMeasures = FALSE
    ServerRestarts = FALSE
    ClientChecksVersion = TRUE
    NegotiatedV20 = TRUE
    PrintTable = FALSE

INVARIANT NoFailures
