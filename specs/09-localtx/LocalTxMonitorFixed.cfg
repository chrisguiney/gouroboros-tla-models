\* SPEC: LocalTxMonitor.tla
\* gOuroboros with this model's three fixes: the server decodes and answers
\* MsgGetMeasures and the client has a call for it, gated on
\* NodeToClientV_20 as the reference encoder is; the server restarts after
\* MsgDone; and the server, given the opt-in await function, answers
\* MsgAwaitAcquire only once the mempool changed. It assumes the two client
\* fixes in open pull requests: Stop releases first (StopReleases), and an
\* await is not timed (ClientTimeouts = FALSE; the model's timer only fires
\* during an await). Two runs, two queries, two mempool changes, as the
\* reference config. Everything should hold, as for the reference.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 2
    MaxQueries = 2
    MaxChanges = 2
    RogueMessages = 0
    BusyKinds = TRUE
    AwaitWaitsForChange = TRUE
    ClientTimeouts = FALSE
    StopReleases = TRUE
    StopCancelsWait = TRUE
    ClientSendsMeasures = TRUE
    ServerKnowsMeasures = TRUE
    ServerRestarts = TRUE
    ClientChecksVersion = TRUE
    NegotiatedV20 = TRUE
    PrintTable = FALSE

INVARIANT TypeOK
INVARIANT NoFailures
INVARIANT RepliesMatchQueries
INVARIANT AwaitGetsNewSnapshot
INVARIANT NeverBothHaveAgency
INVARIANT BusyViewsAgree
INVARIANT NewRunServed
INVARIANT StopNeverWaitsOnPeer

PROPERTY FailuresAreFinal
