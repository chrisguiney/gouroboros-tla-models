\* SPEC: LocalTxMonitor.tla
\* THE BUG (gOuroboros client at PR #3154 head e9996ade, against the node).
\* Intentionally fails: StopNeverWaitsOnPeer is violated. With the
\* re-acquire untimed, Acquire() holds the call lock while MsgAwaitAcquire
\* waits for a mempool change; Stop() takes the same lock before it can
\* act, so only the node's answer would let Stop return. The shortest
\* trace is any call waiting for the server; the await is the one with no
\* bound. The fix (615e2a84) is StopCancelsWait = TRUE.
SPECIFICATION Spec

CONSTANTS
    MaxRuns = 1
    MaxQueries = 0
    MaxChanges = 0
    RogueMessages = 0
    BusyKinds = TRUE
    AwaitWaitsForChange = TRUE
    ClientTimeouts = FALSE
    StopReleases = TRUE
    StopCancelsWait = FALSE
    ClientSendsMeasures = FALSE
    ServerKnowsMeasures = TRUE
    ServerRestarts = FALSE
    ClientChecksVersion = TRUE
    NegotiatedV20 = TRUE
    PrintTable = FALSE

INVARIANT StopNeverWaitsOnPeer
