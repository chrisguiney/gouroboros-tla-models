\* SPEC: EpochNonce.tla
\* The common.Nonce functions, NeutralNonce as the initial nonce: a neutral epoch nonce in the VRF input (EpochNonceVrfInputBug's case) and a neutral evolving nonce.
\* Expected: every invariant holds.
CONSTANTS
    SlotsPerEpoch = 3
    Window = 1
    MaxSlot = 8
    MaxBlocks = 5
    MaxRollback = 2
    Start = "Genesis"
    InitNonce = "Neutral"
    Era = "TPraos"
    EntropyEpochs = {2}
    Caller = "Direct"
    Operand = "Raw"
    GoFix = {}
    GoApi = "Nonce"
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    StateAgrees EpochNonceAgrees VrfInputAgrees CandidateFrozen EpochNonceDenotation
