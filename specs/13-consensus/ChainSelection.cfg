\* Pre-Conway Praos (Babbage): gOuroboros PreferCandidate, with the caller dropping
\* forks deeper than k, must decide every offer as the reference does.
SPECIFICATION Spec

CONSTANTS
    K = 1
    MaxLen = 3
    MaxSlot = 3
    IssueNos = {0, 1, 2}
    Restricted = FALSE
    MaxDist = 1
    CPraos = TRUE
    Routing = "GoPlain"
    Window = 2
    Mutation = "none"

INVARIANT TypeOK
INVARIANT DecisionsAgree
INVARIANT NoRollbackBeyondK
INVARIANT OpCertCountersOnChain
INVARIANT SlotsIncrease
