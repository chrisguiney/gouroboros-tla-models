\* SPEC: EngineLifecycle.tla
\* EngineLifecycleCtxRestartDeferred with the next instance started before
\* readLoop has handed over its carry: the instance reads the queue ahead
\* of the data the previous one read and did not process.
SPECIFICATION Spec

CONSTANTS
    Role = "server"
    Msgs <- MsgThenDone
    ReceivedCallbacks = {"returns", "callsStop", "callsStopForRestart", "waitsForStopChan"}
    HandlerCallbacks = {"returns", "callsStop", "startsRunLoop"}
    RunLoopCallbacks = {"returns", "callsStop", "ignoresStop"}
    CtxMayEnd = TRUE
    TimerFires = FALSE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RestartCarry = "deferred"
    StopJoins = "ctx"
    Mutation = "noCarryWait"

INVARIANT CarryCompleteBeforeNewInstance
