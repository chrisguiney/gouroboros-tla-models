\* SPEC: EngineLifecycle.tla
\* Probe (expected violated): Stop runs before Start.
SPECIFICATION Spec

CONSTANTS
    Role = "client"
    Msgs <- NoMsgs
    ReceivedCallbacks = {"returns"}
    HandlerCallbacks = {"returns"}
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RestartCarry = "wait"
    RunLoopCallbacks = {}
    CtxMayEnd = FALSE
    StopJoins = "none"
    Mutation = "none"
    WatcherJoined = FALSE

INVARIANT ProbeNoStopBeforeStart
