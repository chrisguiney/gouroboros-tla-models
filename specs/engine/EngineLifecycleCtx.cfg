\* SPEC: EngineLifecycle.tla
\* The adopted API: Stop(ctx) joins the four loops and the RunLoop
\* goroutine, bounded by ctx; a callback's Stop with its own marker waits
\* for nothing. Every callback kind, including a handler waiting on the Stop
\* caller and a RunLoop callback that ignores StopChan: passes, with the
\* join whenever Stop returns without an error.
SPECIFICATION Spec

CONSTANTS
    Role = "client"
    Msgs <- OneMsg
    ReceivedCallbacks = {"returns", "callsStop", "waitsForStopChan"}
    HandlerCallbacks = {"returns", "callsStop", "waitsForStopChan", "waitsForCaller", "startsRunLoop"}
    RunLoopCallbacks = {"returns", "callsStop", "waitsForStopChan", "ignoresStop"}
    CtxMayEnd = TRUE
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RestartCarry = "wait"
    StopJoins = "ctx"
    Mutation = "none"
    WatcherJoined = FALSE

INVARIANT DoneImpliesRecvSendExited NoLoopAfterStopStart DoneClosedOnce CarryCompleteBeforeNewInstance NoLockAcrossWait RestartNeverWaitsOnCallback
INVARIANT JoinedAfterCtxStop
