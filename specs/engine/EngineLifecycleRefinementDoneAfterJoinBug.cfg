\* SPEC: EngineLifecycleRefinement.tla
\* gOuroboros 0c00b799 against the interface with DoneAfterJoin: fails
\* RefinesEngine, at the step where the last joined loop exits while the
\* done watcher, not counted by the join, has not closed DoneChan yet.
SPECIFICATION Spec


CONSTANTS
    Role = "client"
    Msgs <- OneMsg
    ReceivedCallbacks = {"returns", "callsStop", "waitsForStopChan"}
    HandlerCallbacks = {"returns", "callsStop", "waitsForStopChan", "waitsForCaller", "startsRunLoop"}
    RunLoopCallbacks = {"returns", "callsStop", "waitsForStopChan", "ignoresStop"}
    CtxMayEnd = TRUE
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RestartCarry = "wait"
    StopJoins = "ctx"
    Mutation = "none"
    WatcherJoined = FALSE
    QCap = 2
    DoneAfterJoin = TRUE

PROPERTY RefinesEngine
