\* SPEC: EngineLifecycleRefinement.tla
\* The fix (the done watcher counted by the join) refines the interface
\* with DoneAfterJoin.
SPECIFICATION Spec


CONSTANTS
    Role = "client"
    Msgs <- OneMsg
    ReceivedCallbacks = {"returns", "callsStop", "waitsForStopChan"}
    HandlerCallbacks = {"returns", "callsStop", "waitsForStopChan", "waitsForCaller", "startsRunLoop"}
    RunLoopCallbacks = {"returns", "callsStop", "waitsForStopChan", "ignoresStop"}
    CtxMayEnd = TRUE
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RestartCarry = "wait"
    StopJoins = "ctx"
    Mutation = "none"
    WatcherJoined = TRUE
    QCap = 2
    DoneAfterJoin = TRUE

PROPERTY RefinesEngine
