\* SPEC: EngineLifecycle.tla
\* The adopted API on a server that restarts after MsgDone: passes.
SPECIFICATION Spec

CONSTANTS
    Role = "server"
    Msgs <- MsgThenDone
    ReceivedCallbacks = {"returns", "callsStop", "waitsForStopChan"}
    HandlerCallbacks = {"returns", "callsStop", "startsRunLoop"}
    RunLoopCallbacks = {"returns", "callsStop", "ignoresStop"}
    CtxMayEnd = TRUE
    TimerFires = FALSE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RestartCarry = "wait"
    StopJoins = "ctx"
    Mutation = "none"
    WatcherJoined = FALSE

INVARIANT DoneImpliesRecvSendExited NoLoopAfterStopStart DoneClosedOnce CarryCompleteBeforeNewInstance NoLockAcrossWait RestartNeverWaitsOnCallback
INVARIANT JoinedAfterCtxStop
