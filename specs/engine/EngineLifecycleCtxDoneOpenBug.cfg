\* SPEC: EngineLifecycle.tla
\* gOuroboros 0c00b799: Stop(ctx) joins the four loops and the RunLoop
\* goroutine, not the done watcher (protocol/protocol.go:508). Fails
\* DoneClosedAfterCtxStop: Stop returns nil with DoneChan still open,
\* because the watcher that closes it has not run yet.
SPECIFICATION Spec


CONSTANTS
    Role = "client"
    Msgs <- OneMsg
    ReceivedCallbacks = {"returns", "callsStop", "waitsForStopChan"}
    HandlerCallbacks = {"returns", "callsStop", "waitsForStopChan", "waitsForCaller", "startsRunLoop"}
    RunLoopCallbacks = {"returns", "callsStop", "waitsForStopChan", "ignoresStop"}
    CtxMayEnd = TRUE
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RestartCarry = "wait"
    StopJoins = "ctx"
    Mutation = "none"
    WatcherJoined = FALSE

INVARIANT DoneImpliesRecvSendExited NoLoopAfterStopStart DoneClosedOnce CarryCompleteBeforeNewInstance NoLockAcrossWait RestartNeverWaitsOnCallback
INVARIANT JoinedAfterCtxStop
INVARIANT DoneClosedAfterCtxStop
