\* SPEC: EngineLifecycle.tla
\* Why Stop takes a context: a RunLoop callback that ignores StopChan
\* holds a Stop whose context never ends, so it never returns: deadlock.
SPECIFICATION Spec

CONSTANTS
    Role = "client"
    Msgs <- OneMsg
    ReceivedCallbacks = {"returns"}
    HandlerCallbacks = {"startsRunLoop"}
    RunLoopCallbacks = {"ignoresStop"}
    CtxMayEnd = FALSE
    TimerFires = FALSE
    MuxerMayStop = FALSE
    RestartOn = "terminal"
    RestartCarry = "wait"
    StopJoins = "ctx"
    Mutation = "none"
    WatcherJoined = FALSE

INVARIANT DoneImpliesRecvSendExited
