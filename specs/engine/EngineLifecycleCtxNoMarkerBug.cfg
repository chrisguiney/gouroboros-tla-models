\* SPEC: EngineLifecycle.tla
\* Mutation: a handler that calls Stop passes no marker, so Stop waits for
\* recvLoop, the goroutine running the handler: deadlock.
SPECIFICATION Spec

CONSTANTS
    Role = "client"
    Msgs <- OneMsg
    ReceivedCallbacks = {"returns"}
    HandlerCallbacks = {"callsStop"}
    RunLoopCallbacks = {}
    CtxMayEnd = TRUE
    TimerFires = FALSE
    MuxerMayStop = FALSE
    RestartOn = "terminal"
    StopJoins = "ctx"
    Mutation = "noMarker"

INVARIANT DoneImpliesRecvSendExited
