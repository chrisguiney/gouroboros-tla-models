\* SPEC: EngineLifecycle.tla
\* Mutation: Start does not check stopped.
SPECIFICATION Spec

CONSTANTS
    Role = "client"
    Msgs <- OneMsg
    ReceivedCallbacks = {"returns"}
    HandlerCallbacks = {"returns"}
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    StopJoins = "none"
    Mutation = "startIgnoresStopped"

INVARIANT NoLoopAfterStopStart
