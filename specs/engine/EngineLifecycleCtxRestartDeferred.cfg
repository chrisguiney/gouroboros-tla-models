\* SPEC: EngineLifecycle.tla
\* The adopted API on a restarting server with the restart's carry
\* deferred to readLoop's exit: MessageReceivedFunc may call StopForRestart
\* with its callback marker, and the MsgDone handler's restart still hands
\* every unread byte to the next instance. Passes.
SPECIFICATION Spec

CONSTANTS
    Role = "server"
    Msgs <- MsgThenDone
    ReceivedCallbacks = {"returns", "callsStop", "callsStopForRestart", "waitsForStopChan"}
    HandlerCallbacks = {"returns", "callsStop", "startsRunLoop"}
    RunLoopCallbacks = {"returns", "callsStop", "ignoresStop"}
    CtxMayEnd = TRUE
    TimerFires = FALSE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RestartCarry = "deferred"
    StopJoins = "ctx"
    Mutation = "none"

INVARIANT DoneImpliesRecvSendExited NoLoopAfterStopStart DoneClosedOnce CarryCompleteBeforeNewInstance NoLockAcrossWait RestartNeverWaitsOnCallback
INVARIANT JoinedAfterCtxStop
