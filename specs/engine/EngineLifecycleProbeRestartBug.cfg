\* SPEC: EngineLifecycle.tla
\* Probe (expected violated): a server restarts.
SPECIFICATION Spec

CONSTANTS
    Role = "server"
    Msgs <- OnlyDone
    ReceivedCallbacks = {"returns"}
    HandlerCallbacks = {"returns"}
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RunLoopCallbacks = {}
    CtxMayEnd = FALSE
    StopJoins = "none"
    Mutation = "none"

INVARIANT ProbeNeverRestarts
