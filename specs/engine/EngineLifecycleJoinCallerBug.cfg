\* SPEC: EngineLifecycle.tla
\* The candidate fix deadlocks when a handler waits on the Stop caller (a
\* lock the caller holds across Stop): the cost of joining in Stop.
SPECIFICATION Spec

CONSTANTS
    Role = "server"
    Msgs <- OneMsg
    ReceivedCallbacks = {"returns"}
    HandlerCallbacks = {"waitsForCaller"}
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    StopJoins = "loops"
    Mutation = "none"

INVARIANT DoneImpliesRecvSendExited NoLoopAfterStopStart DoneClosedOnce CarryCompleteBeforeNewInstance NoLockAcrossWait RestartNeverWaitsOnCallback
