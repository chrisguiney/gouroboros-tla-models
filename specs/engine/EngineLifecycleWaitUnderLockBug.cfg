\* SPEC: EngineLifecycle.tla
\* Mutation: stop holds lifecycleMu until it has unregistered, across the
\* wait for readLoop.
SPECIFICATION Spec

CONSTANTS
    Role = "server"
    Msgs <- OnlyDone
    ReceivedCallbacks = {"returns"}
    HandlerCallbacks = {"returns"}
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RestartCarry = "wait"
    RunLoopCallbacks = {}
    CtxMayEnd = FALSE
    StopJoins = "none"
    Mutation = "waitReadUnderLock"
    WatcherJoined = FALSE

INVARIANT NoLockAcrossWait
