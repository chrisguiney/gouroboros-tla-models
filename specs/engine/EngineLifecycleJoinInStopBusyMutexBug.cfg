\* SPEC: EngineLifecycle.tla
\* Why the join is not in Protocol.Stop: the local-tx clients hold busyMutex
\* across Protocol.Stop, and a handler on recvLoop waiting for busyMutex is
\* a handler waiting on the Stop caller. A Stop that joins the loops then
\* deadlocks.
SPECIFICATION Spec

CONSTANTS
    Role = "server"
    Msgs <- OneMsg
    ReceivedCallbacks = {"returns"}
    HandlerCallbacks = {"waitsForCaller"}
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RunLoopCallbacks = {}
    CtxMayEnd = FALSE
    StopJoins = "loops"
    Mutation = "none"

INVARIANT DoneImpliesRecvSendExited
