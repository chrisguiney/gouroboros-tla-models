\* SPEC: EngineLifecycleRefinement.tla
\* gOuroboros 0c00b799 (EngineLifecycleCtx.cfg's client): the step-by-step
\* engine refines the Engine interface without the DoneAfterJoin contract.
SPECIFICATION Spec


CONSTANTS
    Role = "client"
    Msgs <- OneMsg
    ReceivedCallbacks = {"returns", "callsStop", "waitsForStopChan"}
    HandlerCallbacks = {"returns", "callsStop", "waitsForStopChan", "waitsForCaller", "startsRunLoop"}
    RunLoopCallbacks = {"returns", "callsStop", "waitsForStopChan", "ignoresStop"}
    CtxMayEnd = TRUE
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RestartCarry = "wait"
    StopJoins = "ctx"
    Mutation = "none"
    WatcherJoined = FALSE
    QCap = 2
    DoneAfterJoin = FALSE

PROPERTY RefinesEngine
