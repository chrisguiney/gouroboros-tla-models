\* SPEC: EngineLifecycle.tla
\* Mutation: Stop(ctx) does not wait for the RunLoop goroutine, so it
\* returns while that goroutine still runs its callback.
SPECIFICATION Spec

CONSTANTS
    Role = "client"
    Msgs <- OneMsg
    ReceivedCallbacks = {"returns"}
    HandlerCallbacks = {"startsRunLoop"}
    RunLoopCallbacks = {"waitsForStopChan", "ignoresStop"}
    CtxMayEnd = TRUE
    TimerFires = FALSE
    MuxerMayStop = FALSE
    RestartOn = "terminal"
    StopJoins = "ctx"
    Mutation = "runLoopUnjoined"

INVARIANT JoinedAfterCtxStop
