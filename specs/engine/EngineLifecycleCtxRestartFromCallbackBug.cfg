\* SPEC: EngineLifecycle.tla
\* The adopted Stop(ctx) API: MessageReceivedFunc calling StopForRestart
\* with its callback marker still waits on its own
\* readDoneChan: deadlock.
SPECIFICATION Spec

CONSTANTS
    Role = "server"
    Msgs <- OneMsg
    ReceivedCallbacks = {"callsStopForRestart"}
    HandlerCallbacks = {"returns"}
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RestartCarry = "wait"
    RunLoopCallbacks = {}
    CtxMayEnd = FALSE
    StopJoins = "ctx"
    Mutation = "none"

INVARIANT DoneImpliesRecvSendExited
