\* SPEC: EngineLifecycle.tla
\* Mutation: the done watcher waits only for recvLoop.
SPECIFICATION Spec

CONSTANTS
    Role = "client"
    Msgs <- OneMsg
    ReceivedCallbacks = {"returns"}
    HandlerCallbacks = {"returns"}
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RestartCarry = "wait"
    RunLoopCallbacks = {}
    CtxMayEnd = FALSE
    StopJoins = "none"
    Mutation = "watcherRecvOnly"
    WatcherJoined = FALSE

INVARIANT DoneImpliesRecvSendExited
