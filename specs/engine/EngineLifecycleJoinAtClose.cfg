\* SPEC: EngineLifecycle.tla
\* The fix: Stop joins nothing; the connection's teardown joins every loop
\* before Close returns. Every callback kind, including one waiting on the
\* Stop caller (busyMutex): passes, with JoinedAfterClose.
SPECIFICATION Spec

CONSTANTS
    Role = "server"
    Msgs <- MsgThenDone
    ReceivedCallbacks = {"returns", "callsStop", "waitsForStopChan"}
    HandlerCallbacks = {"returns", "callsStop", "waitsForStopChan", "waitsForCaller"}
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RestartCarry = "wait"
    RunLoopCallbacks = {}
    CtxMayEnd = FALSE
    StopJoins = "close"
    Mutation = "none"
    WatcherJoined = FALSE

INVARIANT DoneImpliesRecvSendExited NoLoopAfterStopStart DoneClosedOnce CarryCompleteBeforeNewInstance NoLockAcrossWait RestartNeverWaitsOnCallback
INVARIANT JoinedAfterClose
