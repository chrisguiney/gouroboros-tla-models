\* SPEC: EngineLifecycle.tla
\* Mutation: StopForRestart does not wait for readLoop.
SPECIFICATION Spec

CONSTANTS
    Role = "server"
    Msgs <- OnlyDone
    ReceivedCallbacks = {"returns"}
    HandlerCallbacks = {"returns"}
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RestartCarry = "wait"
    RunLoopCallbacks = {}
    CtxMayEnd = FALSE
    StopJoins = "none"
    Mutation = "noWaitRead"
    WatcherJoined = FALSE

INVARIANT CarryCompleteBeforeNewInstance
