\* SPEC: EngineLifecycle.tla
\* MessageReceivedFunc calling StopForRestart waits on its own
\* readDoneChan: deadlock.
SPECIFICATION Spec

CONSTANTS
    Role = "server"
    Msgs <- OneMsg
    ReceivedCallbacks = {"callsStopForRestart"}
    HandlerCallbacks = {"returns"}
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    StopJoins = "none"
    Mutation = "none"

INVARIANT DoneImpliesRecvSendExited
