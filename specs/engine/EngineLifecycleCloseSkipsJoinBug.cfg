\* SPEC: EngineLifecycle.tla
\* Mutation: the connection teardown does not wait for the loops.
SPECIFICATION Spec

CONSTANTS
    Role = "server"
    Msgs <- MsgThenDone
    ReceivedCallbacks = {"returns", "callsStop", "waitsForStopChan"}
    HandlerCallbacks = {"returns", "callsStop", "waitsForStopChan", "waitsForCaller"}
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    StopJoins = "close"
    Mutation = "closeSkipsJoin"

INVARIANT JoinedAfterClose
