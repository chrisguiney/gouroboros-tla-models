\* SPEC: EngineLifecycle.tla
\* Probe: the context of a Stop held by a RunLoop callback can end, and
\* Stop then returns ctx.Err().
SPECIFICATION Spec

CONSTANTS
    Role = "client"
    Msgs <- OneMsg
    ReceivedCallbacks = {"returns"}
    HandlerCallbacks = {"startsRunLoop"}
    RunLoopCallbacks = {"ignoresStop"}
    CtxMayEnd = TRUE
    TimerFires = FALSE
    MuxerMayStop = FALSE
    RestartOn = "terminal"
    RestartCarry = "wait"
    StopJoins = "ctx"
    Mutation = "none"

INVARIANT ProbeNeverTimesOut
