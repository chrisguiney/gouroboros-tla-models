\* SPEC: EngineLifecycle.tla
\* gOuroboros 5c4f31c1, a server: every callback behaviour, timer, muxer stop,
\* Stop at any time. No invariant fails and nothing deadlocks: Stop and
\* StopForRestart finish without the peer, and the restart never waits on a
\* callback, because readLoop leaves after queueing MsgDone.
SPECIFICATION Spec

CONSTANTS
    Role = "server"
    Msgs <- MsgThenDone
    ReceivedCallbacks = {"returns", "callsStop", "waitsForStopChan"}
    HandlerCallbacks = {"returns", "callsStop", "waitsForStopChan", "waitsForCaller"}
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "terminal"
    RestartCarry = "wait"
    RunLoopCallbacks = {}
    CtxMayEnd = FALSE
    StopJoins = "none"
    Mutation = "none"

INVARIANT DoneImpliesRecvSendExited NoLoopAfterStopStart DoneClosedOnce CarryCompleteBeforeNewInstance NoLockAcrossWait RestartNeverWaitsOnCallback
