\* SPEC: EngineLifecycle.tla
\* Mutation: a server restarts from an ordinary message while readLoop still
\* reads: StopForRestart waits behind MessageReceivedFunc, and a decode error
\* in readLoop blocks in onceStop.Do behind it (deadlock).
SPECIFICATION Spec

CONSTANTS
    Role = "server"
    Msgs <- TwoMsgs
    ReceivedCallbacks = {"returns", "waitsForStopChan"}
    HandlerCallbacks = {"returns"}
    TimerFires = TRUE
    MuxerMayStop = TRUE
    RestartOn = "anyMessage"
    RunLoopCallbacks = {}
    CtxMayEnd = FALSE
    StopJoins = "none"
    Mutation = "none"

INVARIANT RestartNeverWaitsOnCallback
