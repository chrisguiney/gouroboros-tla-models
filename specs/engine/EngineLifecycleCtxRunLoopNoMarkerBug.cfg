\* SPEC: EngineLifecycle.tla
\* Mutation: a RunLoop callback that calls Stop passes no marker, so Stop
\* waits for the RunLoop goroutine running it: deadlock.
SPECIFICATION Spec

CONSTANTS
    Role = "client"
    Msgs <- OneMsg
    ReceivedCallbacks = {"returns"}
    HandlerCallbacks = {"startsRunLoop"}
    RunLoopCallbacks = {"callsStop"}
    CtxMayEnd = TRUE
    TimerFires = FALSE
    MuxerMayStop = FALSE
    RestartOn = "terminal"
    RestartCarry = "wait"
    StopJoins = "ctx"
    Mutation = "noMarker"
    WatcherJoined = FALSE

INVARIANT DoneImpliesRecvSendExited
