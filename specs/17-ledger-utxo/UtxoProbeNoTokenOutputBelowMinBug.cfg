\* SPEC: Utxo.tla
\* Probe: Mary accepts a token output below the coin minimum. Expected: ProbeNoTokenOutputBelowMin is violated.
SPECIFICATION TableSpec
CONSTANTS
    Era = "Mary"
    MinFee = 1
    MinUtxo = 1
    KeyDeposit = 1
    CollPct = 150
    MaxColl = 2
    StartUtxo <- LedgerStart
    MaxTxs = 0
    Mutation = "none"
INVARIANTS
    ProbeNoTokenOutputBelowMin
