\* SPEC: Utxo.tla
\* Probe: a valid transaction spends an input it also references. Expected: ProbeNoReferenceSpent is violated.
SPECIFICATION Spec
CONSTANTS
    Era = "Babbage"
    MinFee = 1
    MinUtxo = 1
    KeyDeposit = 1
    CollPct = 150
    MaxColl = 2
    StartUtxo <- LedgerStart
    MaxTxs = 2
    Mutation = "none"
INVARIANTS
    ProbeNoReferenceSpent
