\* SPEC: Utxo.tla
\* Probe: a transaction with a collateral return and total is accepted. Expected: ProbeNoReturnAccepted is violated.
SPECIFICATION TableSpec
CONSTANTS
    Era = "Babbage"
    MinFee = 1
    MinUtxo = 1
    KeyDeposit = 1
    CollPct = 150
    MaxColl = 2
    StartUtxo <- LedgerStart
    MaxTxs = 0
    Mutation = "none"
INVARIANTS
    ProbeNoReturnAccepted
