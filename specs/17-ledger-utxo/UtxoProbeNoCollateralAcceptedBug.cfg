\* SPEC: Utxo.tla
\* Probe: a transaction with redeemers is accepted. Expected: ProbeNoCollateralAccepted is violated.
SPECIFICATION TableSpec
CONSTANTS
    Era = "Alonzo"
    MinFee = 1
    MinUtxo = 1
    KeyDeposit = 1
    CollPct = 150
    MaxColl = 2
    StartUtxo <- LedgerStart
    MaxTxs = 0
    Mutation = "none"
INVARIANTS
    ProbeNoCollateralAccepted
