\* SPEC: Utxo.tla
\* Mutation: a valid transaction spends its reference inputs.
\* Expected: KeptUnspent fails.
SPECIFICATION Spec
CONSTANTS
    Era = "Babbage"
    MinFee = 1
    MinUtxo = 1
    KeyDeposit = 1
    CollPct = 150
    MaxColl = 2
    StartUtxo <- LedgerStart
    MaxTxs = 2
    Mutation = "SpecRefConsumed"
INVARIANTS
    KeptUnspent
