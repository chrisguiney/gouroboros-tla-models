\* SPEC: Utxo.tla
\* Mutation: Babbage (pv 7-8) rejects reference inputs that are also spent.
\* Expected: GoAgrees fails.
SPECIFICATION TableSpec
CONSTANTS
    Era = "Babbage"
    MinFee = 1
    MinUtxo = 1
    KeyDeposit = 1
    CollPct = 150
    MaxColl = 2
    StartUtxo <- LedgerStart
    MaxTxs = 0
    Mutation = "GoDisjointAlways"
INVARIANTS
    GoAgrees
